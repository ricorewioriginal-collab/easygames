    background:linear-gradient(90deg,transparent,rgba(10,14,30,.8) 20%,rgba(10,14,30,.8) 80%,transparent);text-shadow:0 0 18px rgba(70,230,255,.5),0 2px 10px #000;border-top:1px solid rgba(255,210,74,.6);border-bottom:1px solid rgba(255,210,74,.6);min-width:min(520px,90vw)}

</div>
