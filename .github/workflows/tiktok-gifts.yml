# TikTok-Geschenke mit echten Bildern (tiktok-gifts.json) täglich aktualisieren – für die TikTok-LIVE-Einstellungen
# (stream-tiktok.js, Windows-App). Quelle: streamtoearn.io/gifts (täglich gepflegt), Bilder liegen auf TikToks Server.
name: TikTok-Geschenke

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-gifts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Liste holen
        run: node tools/tiktok-gifts.mjs
      - name: Einchecken, wenn geändert
        run: |
          git diff --quiet -- tiktok-gifts.json && { echo "Unverändert"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tiktok-gifts.json
          git commit -m "TikTok-Geschenke aktualisiert"
          git pull --rebase --autostash
          git push
