name: Android offline build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: node tools/fetch-vendor.js --verify
      - run: node tools/test-sync-build.js
      - run: bash android/server/test-publish.sh
      - run: node tools/test-cloud-copies.js
      - run: node --test tools/test-cloud-merge.mjs
      - run: node tools/test-board.mjs
      - run: node tools/test-ach.mjs
      - run: node tools/test-share-pages.js
      - run: node tools/test-gameach.cjs
      - run: node tools/test-chatfilter.mjs
      - run: node tools/test-engage.mjs
      - run: node tools/build-sync.js --strict --stage android/app/src/main/assets/easygames
      - name: Install browser test runtime
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/easygames-browser" playwright@1.62.1
          node "$RUNNER_TEMP/easygames-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify offline in-app launches and deferred updates
        run: NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/android-runtime-audit.js
      - name: Verify Google save script in all cloud games
        run: NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-cloud-games.cjs
      - name: Verify Firestore call budget of the Google save script
        run: NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-cloud-calls.cjs
      - name: Verify central leaderboard page and embedding
        run: NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-ranglisten.cjs
      - name: Verify cross-game achievements page and embedding
        run: |
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-erfolge.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-konto.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-account.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-chat.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-bug.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-verwaltung.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-stats.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-heute.cjs
          NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-profil.cjs
      - name: Verify back link from embedded games
        run: NODE_PATH="$RUNNER_TEMP/easygames-browser/node_modules" node tools/test-embed-back.cjs
      - run: ./android/gradlew -p android :core:test :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: easygames-android-test
          path: android/app/build/outputs/apk/debug/app-debug.apk

  sync:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: easygames-sync-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/build-sync.js --strict
      - name: Publish updated game catalog and checksums
        run: |
          if git diff --quiet -- sync/manifest.json sync/catalog.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sync/manifest.json sync/catalog.json
          git commit -m 'chore: refresh Android offline game catalog'
          git push origin HEAD:main
