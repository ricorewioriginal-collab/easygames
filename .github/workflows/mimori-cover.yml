name: Render Mimori catalog cover
on:
  push:
    branches: [main]
    paths:
      - 'mimori/cover.svg'
      - '.github/workflows/mimori-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y librsvg2-bin
      - name: Create PNG for external catalogs and social previews
        run: |
          rsvg-convert --width 1200 --height 630 --format png --output mimori/cover.png mimori/cover.svg
          file mimori/cover.png
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mimori/cover.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(mimori): generate 1200x630 PNG cover [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
