name: ZEITSPRUNG – Hörproben der Moderatorstimmen
on:
  push:
    branches-ignore: [main]
    paths:
      - 'tools/zeitsprung-voice/samples.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg && pip install edge-tts
      - run: python3 tools/zeitsprung-voice/samples.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/zeitsprung-voice/samples
          if ! git diff --cached --quiet; then
            git commit -m "ZEITSPRUNG: Hörproben der Moderatorstimmen"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
