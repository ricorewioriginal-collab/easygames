<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Profile – easygames</title>
<style>
:root{--bg:#0b1020;--text:#f3f5ff;--line:#ffffff24;--primary:#a58cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
header span{flex:1}
.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
body.embed header{display:none}
#cloudMount{max-width:1100px;margin:0 auto;padding:0 16px}
#cloudMount[hidden]{display:none}
#app{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<header><span></span><a class="back" href="index.html">← Spiele</a></header>
<div id="cloudMount"></div>
<div id="app" aria-live="polite"></div>

<script src="cloud/anmacha-cloud.js" data-game="radio-profil" data-prefix="anmacha-radio-profil-ohne-spielstand" data-mount="#cloudMount" data-sync="off" data-board="off" data-hint="Mit Google anmelden, um ein eigenes Profil anzulegen." defer></script>
<script src="cloud/radio-erfolge.js" defer></script>
<script src="cloud/radio-profil.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var Cloud = window.AnMaChaCloud, P = window.RRWProfil, app = document.getElementById('app'), mount = document.getElementById('cloudMount'), was = null, st = { mode: 'me', slug: '' };
  if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('embed');
  if (!Cloud || !P || !window.RRWErfolge) { app.textContent = 'Die Profile sind gerade nicht verfügbar.'; return; }
  var q = new URLSearchParams(location.search);
  if (q.get('u')) st = { mode: 'view', slug: q.get('u') }; else if (q.get('liste') === '1') st.mode = 'list';
  function token() { return Cloud.serverToken().then(function (t) { mount.hidden = !!t || st.mode !== 'me'; return t || ''; }); }
  function nav(mode, slug) { st = { mode: mode, slug: slug || '' }; show(); }
  function show() { P.render(app, { mode: st.mode, slug: st.slug, token: token, nav: nav, catalogUrl: 'sync/catalog.json' }); }
  setInterval(function () { var u = !!(Cloud.user && Cloud.user()); if (u !== was) { was = u; show(); } }, 800);
});
</script>
</body>
</html>
