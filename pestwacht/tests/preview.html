<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#000}#stage{position:absolute;inset:0}</style></head><body><div id="stage"></div>
<script src="../../vendor/three-r128.min.js"></script>
<script src="../js/data.js"></script><script src="../js/core.js"></script><script src="../js/world.js"></script><script src="../js/battle.js"></script><script src="../js/city.js"></script><script src="../js/heroes.js"></script><script src="../js/econ.js"></script><script src="../js/march.js"></script><script src="../js/ai.js"></script><script src="../js/diplo.js"></script><script src="../js/waves.js"></script><script src="../js/campaign.js"></script><script src="../js/game.js"></script><script src="../js/render.js"></script>
<script>
/* Vorschau ohne Oberfläche: rendert Stadt, Welle, Weltkarte und Schlacht für Screenshots/Smoke-Tests */
const q=new URLSearchParams(location.search), view=q.get('v')||'city';
const S=PW.Game.newGame({seed:'vorschau',mode:'free'});
const C=PW.City; [['kraeuter',19,17],['akademie',6,12],['markt',19,20],['kaserne',6,22],['lager',3,15],['turm_balliste',11,25],['laterne',13,21],['garten',16,18],['garten',17,19],['haus',3,3],['haus',6,3]].forEach(([t,x,y])=>C.create(S,t,x,y,0,2,'ok'));
C.create(S,'heilstube',9,19,0,1,'bau').rem=5; C.get(S,S.city.uid).tot=10;
S.time=60; PW.Game.refresh(S);
const ui={sel:null,place:null,tile:-1};
PW.R.init(document.getElementById('stage'),'hoch');
if(view==='wave'){PW.Waves.start(S,{boss:'schwarmfuerst'});S.waves.active.n=5;for(let i=0;i<70;i++)PW.Game.tick(S,0.5);PW.R.focus(12,27,26);PW.R.rigs.city.yaw=0.5;}
if(view==='world'){S.fog='1'.repeat(S.fog.length);for(let i=0;i<1200;i++)PW.Game.tick(S,0.5);PW.R.setMode('world');PW.R.focusTile(S,S.world.caps[0],30);}
if(view==='battle'){PW.R.setMode('battle');ui.bview=PW.Battle.make({seed:1,terrain:'wald',att:{units:{spear:30,bow:20,rider:10},heroes:[PW.Heroes.stats(S,'veit')]},def:{units:{spear:25,bow:25}},siege:{wall:600,towers:20}});for(let i=0;i<60;i++)PW.Battle.step(ui.battle,0.2);ui.battleMine=0;}
if(view==='models'){PW.R.setMode('battle');const sq=[];['spear','bow','rider','medic','hunter','ram'].forEach((t,k)=>sq.push({s:0,kind:'unit',type:t,n:1,n0:12,x:-6+k*2.4,y:-3}));sq.push({s:0,kind:'hero',type:'hero',heroId:'veit',n:1,n0:1,x:9,y:-3});
['ratte','gaenger','bandit','bestie','kraehe'].forEach((t,k)=>sq.push({s:1,kind:'mon',type:t,n:1,n0:10,x:-6+k*2.6,y:2}));['hauptmann','faeulnismutter','schwarmfuerst'].forEach((t,k)=>sq.push({s:1,kind:'mon',boss:true,type:t,n:1,n0:1,x:-4+k*5,y:8}));
ui.bview={sq,fx:[],terrain:'ebene',wall:0,wallMax:0,towers:0};ui.battleMine=0;const r=PW.R.rigs.battle;r.tx=+(q.get('tx')||2);r.tz=+(q.get('tz')||2);r.dist=+(q.get('d')||16);r.pitch=+(q.get('p')||0.55);r.yaw=+(q.get('y')||0.25);}
if(view==='battle2'){PW.R.setMode('battle');ui.bview=PW.Battle.make({seed:2,terrain:'sumpf',att:{units:{spear:40,bow:30,medic:10,hunter:15,ram:4,rider:12},heroes:[PW.Heroes.stats(S,'veit')]},def:{mon:{gaenger:40,ratte:60,bestie:3,kraehe:20,bandit:15},boss:'hauptmann'}});for(let i=0;i<45;i++)PW.Battle.step(ui.battle,0.2);ui.battleMine=0;PW.R.rigs.battle.dist=+(q.get('d')||26);}
if(view==='night'){S.time=PW.DAY*0.02;}
if(view==='place'){ui.place={type:'farm',x:20,y:5,rot:0};ui.sel=null}
let t=performance.now();function loop(){const n=performance.now();PW.R.frame(S,ui,Math.min(0.1,(n-t)/1000));t=n;requestAnimationFrame(loop);}loop();
window.READY=true;
</script></body></html>
