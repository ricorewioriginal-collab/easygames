<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2c7fd6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Bunte Insel 2 – das große farbenfrohe 3D-Abenteuer: deine Insel, viele Welten, ein Geheimnis. Für Handy und PC.">
<title>Bunte Insel 2 ♥</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/fredoka-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{font-family:'Fredoka';font-style:normal;font-display:swap;font-weight:300 700;src:url(./fonts/fredoka-latin-wght-normal.woff2) format('woff2')}
  html,body{margin:0;height:100%;background:#1b3f8a;overflow:hidden;font-family:Fredoka,'Trebuchet MS',system-ui,sans-serif}
  #boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#6fd0ff,#2c7fd6 55%,#1b3f8a);color:#fff;text-align:center;padding:20px}
  #boot .logo{font-size:clamp(2.4rem,8vw,4.6rem);font-weight:700;text-shadow:0 6px 0 rgba(0,0,0,.18)}
  #boot .logo span{color:#ffd23f}
  #boot .bar{width:min(420px,80vw);height:18px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden;margin:1.4em auto .6em;border:3px solid rgba(255,255,255,.6)}
  #boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff5fb0,#8a5bff);transition:width .2s}
  #boot .err{max-width:520px;margin:1em auto;background:rgba(0,0,0,.25);padding:1em;border-radius:16px}
  #boot button{font:inherit;font-weight:700;font-size:1.1rem;padding:.7em 1.4em;border-radius:999px;border:0;background:#ffd23f;color:#2a1f4a;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Spielwelt"></canvas>
<div id="ui"></div>
<div id="boot" role="status" aria-live="polite">
  <div>
    <div class="logo">Bunte Insel <span>2 ♥</span></div>
    <div class="bar"><i id="bootbar"></i></div>
    <div id="bootstep">Lade Grafik-Engine …</div>
    <div id="booterr"></div>
  </div>
</div>
<noscript><p style="color:#fff;text-align:center">Bunte Insel 2 braucht JavaScript.</p></noscript>
<script>
/* Robuster Start: echte Ladeanzeige (gemessene Bytes), Zeitlimit, Wiederholen-Knopf. */
(function () {
  var bar = document.getElementById('bootbar'), step = document.getElementById('bootstep'), errEl = document.getElementById('booterr');
  window.__boot = {
    set: function (p, text) { bar.style.width = Math.max(0, Math.min(100, p)).toFixed(0) + '%'; if (text) step.textContent = text; },
    fail: function (msg) {
      errEl.innerHTML = '';
      var d = document.createElement('div'); d.className = 'err';
      d.textContent = 'Das Spiel konnte nicht starten: ' + msg;
      var b = document.createElement('button'); b.textContent = '↻ Nochmal versuchen'; b.onclick = function () { location.reload(); };
      d.appendChild(document.createElement('br')); d.appendChild(b); errEl.appendChild(d);
    },
    done: function () { var b = document.getElementById('boot'); if (b) { b.style.transition = 'opacity .4s'; b.style.opacity = '0'; setTimeout(function () { b.remove(); }, 450); } }
  };
  function loadThree() {
    var url = './vendor/three.min.js?v=r128';
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 45000);
    return fetch(url, ctrl ? { signal: ctrl.signal } : {}).then(function (r) {
      if (!r.ok) throw new Error('Grafik-Engine nicht gefunden (' + r.status + ')');
      var total = +r.headers.get('content-length') || 603445, got = 0;
      if (!r.body || !r.body.getReader) return r.text();
      var reader = r.body.getReader(), chunks = [];
      function pump() {
        return reader.read().then(function (x) {
          if (x.done) return;
          chunks.push(x.value); got += x.value.length;
          window.__boot.set(5 + Math.min(1, got / total) * 50, 'Lade Grafik-Engine … ' + Math.round(got / 1024) + ' KB');
          return pump();
        });
      }
      return pump().then(function () { return new Blob(chunks).text(); });
    }).then(function (code) {
      clearTimeout(timer);
      var s = document.createElement('script'); s.text = code; document.head.appendChild(s);
      if (!window.THREE) throw new Error('Grafik-Engine defekt');
      window.__boot.set(56, 'Starte Spiel …');
    });
  }
  window.__threeReady = loadThree().catch(function (e) {
    window.__boot.fail((e && e.name === 'AbortError') ? 'Zeitüberschreitung beim Laden. Bitte Internetverbindung prüfen.' : (e && e.message) || String(e));
    throw e;
  });
  window.addEventListener('error', function (e) { if (!window.__started) window.__boot.fail(e.message || 'Unbekannter Fehler'); });
})();
</script>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
