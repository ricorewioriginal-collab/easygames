<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<title>Gay Life! – die Spielesammlung</title>
<style>
:root{--bg:#110a22;--bg2:#1b1235;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#f6f1ff;--mu:#b9acd6;--rb:linear-gradient(90deg,#ff3b6b,#ff9f1c,#ffe14d,#3ddc84,#2ea8ff,#9b5cff);--pk:#ff4f9a;--ok:#3ddc84;--bad:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 700px at 10% -10%,#3b1b6e 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#7a1d5a 0,transparent 55%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0}
.logo{font-weight:900;font-size:clamp(34px,8vw,64px);letter-spacing:-1px;background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.sub{color:var(--mu);margin:4px 0 0}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;backdrop-filter:blur(10px);flex:1;min-width:280px}
.prof .av{width:76px;height:90px;border-radius:16px;overflow:hidden;flex:none}
.prof b{font-size:19px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.chip.on{background:linear-gradient(90deg,#ff3b6b55,#9b5cff55);border-color:#fff5}
.btn{border:0;border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.12);border:1px solid var(--line);font-weight:600}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.pri{background:linear-gradient(90deg,#ff3b6b,#9b5cff);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.gcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);padding:0;display:flex;flex-direction:column;transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .pic{height:150px;display:flex;align-items:flex-end;justify-content:center;gap:0;overflow:hidden}
.gcard .pic svg{height:150px;width:auto;display:block}
.gcard .in{padding:12px 16px 16px}
.gcard h3{font-size:20px}
.gcard p{margin:4px 0 0;color:var(--mu);font-size:14px}
.gcard .best{position:absolute;top:10px;right:10px;font-size:12px;background:#000a;border-radius:99px;padding:3px 10px}
.foot{color:var(--mu);font-size:12px;text-align:center;margin:26px 0 10px}
#game{display:none;min-height:100vh}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gh h2{font-size:22px;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(8px)}
.bubble{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;margin:10px 0}
.bubble.me{border-radius:18px 18px 4px 18px;background:linear-gradient(90deg,#ff3b6b44,#9b5cff44)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.opt:hover:not(:disabled){background:rgba(255,255,255,.17)}
.opt:disabled{opacity:.55;cursor:default}
.opt.ok{background:#3ddc8433;border-color:var(--ok);opacity:1}
.opt.no{background:#ff5d6c33;border-color:var(--bad);opacity:1}
.dateTop{display:flex;gap:14px;align-items:center}
.dateTop .av{width:110px;height:132px;border-radius:20px;overflow:hidden;flex:none}
.hearts{font-size:22px;letter-spacing:2px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rb);width:100%}
.big{font-size:clamp(30px,7vw,48px);font-weight:900}
.tap{width:min(60vw,230px);aspect-ratio:1;border-radius:50%;border:4px solid #fff5;background:radial-gradient(circle at 50% 30%,#ff7ac0,#7d3cff 70%);overflow:hidden;padding:0;margin:8px auto;display:block;box-shadow:0 0 50px #ff4f9a66;touch-action:manipulation;user-select:none}
.tap:active{transform:scale(.96)}
.tap svg{width:100%;height:100%;display:block;pointer-events:none}
.up{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);width:100%;text-align:left}
.up:disabled{opacity:.45}
.up .e{font-size:26px;width:34px;text-align:center}
.up small{display:block;color:var(--mu)}
.fly{position:fixed;z-index:30;font-size:44px;border:0;background:none;animation:fl 1.8s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-18px) rotate(10deg)}}
#cv{display:block;width:100%;height:min(72vh,640px);border-radius:20px;background:#0b0618;touch-action:none;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;border:1px solid var(--line);border-radius:99px;padding:9px 18px;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:var(--bg);display:none;z-index:40;overflow:auto}
.modal .box{max-width:720px;margin:0 auto;padding:16px}
.edit{display:grid;grid-template-columns:200px 1fr;gap:16px}
.edit .av{width:200px;height:240px;border-radius:22px;overflow:hidden;position:sticky;top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.pill.lock{opacity:.6}.sw.on,.pill.on{outline:3px solid #fff;outline-offset:1px}
.pill{border-radius:99px;padding:5px 12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:14px}
.lab{font-size:13px;color:var(--mu);margin:12px 0 5px}
input[type=text]{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;width:100%}
.jury{display:grid;gap:6px;margin-top:8px}
.jury div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-size:14px}
.stars{font-size:28px}

.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.sparkbar{position:relative;height:44px;border-radius:22px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.sparkbar .zone{position:absolute;top:0;bottom:0;background:rgba(61,220,132,.55);border-left:2px solid #3ddc84;border-right:2px solid #3ddc84}
.sparkbar .mk{position:absolute;top:6px;font-size:28px;transform:translateX(-50%);line-height:1}
.gs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.slot{min-height:150px}
.gu{position:relative;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;padding:4px;text-align:center;cursor:pointer;animation:pop .25s;transition:transform .2s,opacity .4s}
.gu.sel{border-color:#fff;box-shadow:0 0 14px #fff8}
.gu.t-drag{border-color:#ffb020;background:linear-gradient(#ffb02033,#ff3b6b22)}
.gu.leave{opacity:0;transform:translateY(-26px)}
.gu.shake{animation:shk .3s}
.gu .wish{font-size:20px;min-height:30px;line-height:30px;white-space:nowrap}
.gu .gav{height:78px;border-radius:10px;overflow:hidden;pointer-events:none}.gu .gav svg{width:100%;height:100%;display:block}
.gu .gb{height:6px;border-radius:5px;background:rgba(255,255,255,.15);margin-top:5px;overflow:hidden}.gu .gb i{display:block;height:100%;width:100%;background:#3ddc84}
.gu .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;background:#ffb020;color:#220;border-radius:9px;padding:0 6px;white-space:nowrap}
.tipfly{position:absolute;left:0;right:0;top:20px;font-weight:900;font-size:22px;color:#ffe14d;text-shadow:0 2px 4px #000;pointer-events:none}
@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.drinks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dk{border:2px solid var(--line);background:rgba(255,255,255,.08);border-radius:14px;padding:8px 2px;font-size:28px;line-height:1.1}.dk small{display:block;font-size:10px;color:var(--mu)}
.dk.on{border-color:#fff;background:rgba(255,255,255,.22);transform:translateY(-3px)}
.jury .jr{display:flex;gap:10px;align-items:center;text-align:left}.pad{flex:none;width:36px;height:36px;border-radius:9px;background:#fff;color:#c2185b;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)}
#world{position:fixed;inset:0;z-index:5;display:none;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#wc{width:100%;height:100%;display:block;touch-action:none}
.wt{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.wchip{background:rgba(20,10,40,.64);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;line-height:1.35}
#wq{max-width:min(430px,60vw)}
.wbt{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:auto}
.wbt button{background:rgba(20,10,40,.64);border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:16px}
#arrw{position:absolute;right:12px;top:calc(222px + env(safe-area-inset-top));text-align:center;pointer-events:none;color:#fff;text-shadow:0 1px 4px #000;font-size:12px}
#arr{font-size:30px;line-height:1;color:#ffe14d;display:none}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none;z-index:7}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
#act{position:absolute;right:16px;bottom:calc(28px + env(safe-area-inset-bottom));display:none;background:linear-gradient(90deg,#ff3b6b,#9b5cff);border:0;border-radius:99px;padding:16px 24px;font-size:17px;font-weight:800;box-shadow:0 6px 24px #0008;max-width:80vw}
#dlg{position:absolute;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));display:none;gap:12px;align-items:center;background:rgba(20,10,40,.88);border:1px solid var(--line);border-radius:20px;padding:12px;max-width:640px;margin:0 auto;z-index:8}
#dlg .dav{width:84px;height:100px;border-radius:14px;overflow:hidden;flex:none}#dlg .dav svg{width:100%;height:100%;display:block}
#dlg p{margin:4px 0 8px;font-size:15px}
#emo{position:absolute;right:10px;bottom:90px;display:none;flex-direction:column;gap:6px;z-index:5}#emo button{background:rgba(20,10,40,.64);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;font-size:20px;padding:0}
#maps{position:absolute;inset:0;background:rgba(10,5,25,.92);display:none;overflow:auto;padding:16px;z-index:9}#maps .box{max-width:560px;margin:0 auto}#maps .row2{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:16px;padding:10px}#maps .row2 span.e{font-size:30px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.mg{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:rgba(255,255,255,.08);font-size:clamp(20px,6.5vw,34px);padding:0;line-height:1}.mg.sel{border-color:#fff;background:rgba(255,255,255,.25);transform:scale(1.06)}.mg.pop{animation:pp .26s forwards}@keyframes pp{to{transform:scale(1.3);opacity:0}}
.weights{font-size:30px;text-align:center;min-height:40px;margin-top:6px}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pad4{font-size:34px;padding:18px 0;border-radius:16px;border:2px solid var(--line);background:rgba(255,255,255,.08)}.pad4.lit{background:#ff4f9a;border-color:#fff;transform:scale(1.08)}
.sauna{position:relative;height:30px;margin:12px 0;border-radius:15px;background:linear-gradient(90deg,#3a7bff,#3ddc84 45%,#ffd23f 62%,#ff3b6b)}.sauna .hz{position:absolute;left:45%;width:25%;top:-4px;bottom:-4px;border:2px solid #fff;border-radius:12px}.sauna .hm{position:absolute;top:-6px;font-size:28px;transform:translateX(-50%);transition:left .1s linear}
.kbox{min-height:110px;display:flex;align-items:center;justify-content:center;margin-top:8px}.kline{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;font-size:clamp(20px,6vw,30px);font-weight:800}.sy{padding:2px 4px;border-radius:8px;opacity:.55}.sy.on{opacity:1;background:#fff3;transform:scale(1.15)}.sy.p{color:#ffe14d;opacity:1}.sy.g{color:#3ddc84;opacity:1}.sy.m{color:#ff5d6c}
#ban{position:absolute;left:0;right:0;top:32%;text-align:center;display:none;pointer-events:none;font-weight:900;font-size:clamp(26px,6vw,48px);text-shadow:0 3px 12px #000;color:#fff}
#ban small{display:block;font-size:.4em;font-weight:600;opacity:.9}
#ban.in{animation:bn 3.6s ease-out both}@keyframes bn{0%{transform:scale(.6);opacity:0}10%{transform:scale(1.06);opacity:1}85%{opacity:1}100%{opacity:0}}
.wcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;max-width:min(430px,60vw)}
#hud{pointer-events:auto;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:inherit;font-size:12px;line-height:1.3;font-family:inherit;text-align:left;cursor:pointer}
#hud .hc{font-weight:700;white-space:nowrap}#hud .hn{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.hb{display:inline-block;width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;vertical-align:middle}.hb b{display:block;height:100%}
#phone{position:absolute;z-index:12;right:max(10px,env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));bottom:calc(10px + env(safe-area-inset-bottom));width:min(390px,calc(100% - 20px));display:none}
#phone.on{display:block}
#phone .pin{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#1d1238,#120a24);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 60px #000a;overflow:hidden}
#phone .ptop{display:flex;justify-content:space-between;padding:8px 18px 2px;font-size:12px;color:var(--mu)}
#phone .phead{display:flex;align-items:center;gap:10px;padding:6px 12px 10px;border-bottom:1px solid var(--line)}#phone .phead b{font-size:18px}
#phone .pbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.papp{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;padding:6px 0}.papp span{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(145deg,#ff3b6b55,#9b5cff66);border:1px solid var(--line)}
.bdg{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#ff3b6b;color:#fff;font:700 12px/20px system-ui;font-style:normal;text-align:center;padding:0 5px}.papp span{position:relative}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:8px}.pcard small{display:block;margin-top:4px}
.pbar{margin:6px 0 2px}.prow{display:flex;gap:10px;align-items:center}.pav{width:48px;height:58px;border-radius:12px;overflow:hidden;flex:none}.pav svg{width:100%;height:100%;display:block}
.pline{padding:8px 2px;border-bottom:1px solid var(--line)}
.pmap{width:100%;border-radius:14px;display:block;margin-bottom:8px}.pmap .pm{cursor:pointer}
#phone .row2{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:16px;padding:10px}#phone .row2 span.e{font-size:30px}
#maps .row2:disabled{cursor:default}
#fade{position:absolute;inset:0;z-index:20;background:#0b0618;opacity:0;pointer-events:none;transition:opacity .35s;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5vw,32px);font-weight:800;text-align:center;padding:20px}
#fade.on{opacity:1;pointer-events:auto}
@media(max-width:560px){#phone{left:0;right:0;top:0;bottom:0;width:auto}#phone .pin{border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}.wcol{max-width:62vw}#wq{font-size:12px}}
@media(max-width:560px){.edit{grid-template-columns:1fr}.edit .av{position:static;margin:0 auto}}
</style>
</head>
<body>
<div class="wrap" id="hub"></div>
<div class="wrap" id="game"></div>
<div id="world"><canvas id="wc"></canvas><div class="wt"><div class="wcol"><div class="wchip" id="wq"></div><button class="wchip" id="hud" title="Status (Handy)"></button></div><div style="margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end"><div class="wchip" id="wgl"></div><div class="wbt"><button id="wPh" title="Handy (P)">📱</button><button id="wLook" title="Look">👤</button><button id="wMp" title="Mehrspieler">👥</button><button id="wMap" title="Orte">🗺️</button><button id="wSnd">🔊</button><button id="wFs" title="Vollbild (F)">⛶</button></div></div></div><div id="arrw"><div id="arr">▲</div><span id="adist"></span></div><div id="joy"><i></i></div><button id="act"></button><div id="dlg"></div><div id="ban"></div><div id="emo"><button>👋</button><button>💃</button><button>❤️</button><button>😂</button><button>🌈</button></div><div id="maps"></div><div id="phone"></div><div id="fade"></div></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../cloud/anmacha-cloud.js" data-game="gay-life" data-prefix="anmachaGayLife" data-save-btn="#glSave" defer></script>
<script src="js/state.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/life.js"></script>
<script src="js/economy.js"></script>
<script src="js/home.js"></script>
<script src="js/social.js"></script>
<script src="js/people.js"></script>
<script src="js/messages.js"></script>
<script src="js/dating.js"></script>
<script src="js/furniture.js"></script>
<script src="js/phone.js"></script>
<script src="js/datingapp.js"></script>
<script src="js/main.js"></script>
</body>
</html>
