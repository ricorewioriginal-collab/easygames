<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120a24">
<title>Gay Life! – die Spielesammlung</title>
<style>
:root{--bg:#110a22;--bg2:#1b1235;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--tx:#f6f1ff;--mu:#b9acd6;--rb:linear-gradient(90deg,#ff3b6b,#ff9f1c,#ffe14d,#3ddc84,#2ea8ff,#9b5cff);--pk:#ff4f9a;--ok:#3ddc84;--bad:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(1200px 700px at 10% -10%,#3b1b6e 0,transparent 60%),radial-gradient(900px 600px at 100% 0,#7a1d5a 0,transparent 55%),var(--bg);background-attachment:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0}
.logo{font-weight:900;font-size:clamp(34px,8vw,64px);letter-spacing:-1px;background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.sub{color:var(--mu);margin:4px 0 0}
.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.prof{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 16px;backdrop-filter:blur(10px);flex:1;min-width:280px}
.prof .av{width:76px;height:90px;border-radius:16px;overflow:hidden;flex:none}
.prof b{font-size:19px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.chip.on{background:linear-gradient(90deg,#ff3b6b55,#9b5cff55);border-color:#fff5}
.btn{border:0;border-radius:14px;padding:10px 16px;background:rgba(255,255,255,.12);border:1px solid var(--line);font-weight:600}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.pri{background:linear-gradient(90deg,#ff3b6b,#9b5cff);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.gcard{position:relative;text-align:left;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);padding:0;display:flex;flex-direction:column;transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.gcard .pic{height:150px;display:flex;align-items:flex-end;justify-content:center;gap:0;overflow:hidden}
.gcard .pic svg{height:150px;width:auto;display:block}
.gcard .in{padding:12px 16px 16px}
.gcard h3{font-size:20px}
.gcard p{margin:4px 0 0;color:var(--mu);font-size:14px}
.gcard .best{position:absolute;top:10px;right:10px;font-size:12px;background:#000a;border-radius:99px;padding:3px 10px}
.foot{color:var(--mu);font-size:12px;text-align:center;margin:26px 0 10px}
#game{display:none;min-height:100vh}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gh h2{font-size:22px;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(8px)}
.bubble{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;margin:10px 0}
.bubble.me{border-radius:18px 18px 4px 18px;background:linear-gradient(90deg,#ff3b6b44,#9b5cff44)}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.opt:hover:not(:disabled){background:rgba(255,255,255,.17)}
.opt:disabled{opacity:.55;cursor:default}
.opt.ok{background:#3ddc8433;border-color:var(--ok);opacity:1}
.opt.no{background:#ff5d6c33;border-color:var(--bad);opacity:1}
.dateTop{display:flex;gap:14px;align-items:center}
.dateTop .av{width:110px;height:132px;border-radius:20px;overflow:hidden;flex:none}
.hearts{font-size:22px;letter-spacing:2px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rb);width:100%}
.big{font-size:clamp(30px,7vw,48px);font-weight:900}
.tap{width:min(60vw,230px);aspect-ratio:1;border-radius:50%;border:4px solid #fff5;background:radial-gradient(circle at 50% 30%,#ff7ac0,#7d3cff 70%);overflow:hidden;padding:0;margin:8px auto;display:block;box-shadow:0 0 50px #ff4f9a66;touch-action:manipulation;user-select:none}
.tap:active{transform:scale(.96)}
.tap svg{width:100%;height:100%;display:block;pointer-events:none}
.up{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);width:100%;text-align:left}
.up:disabled{opacity:.45}
.up .e{font-size:26px;width:34px;text-align:center}
.up small{display:block;color:var(--mu)}
.fly{position:fixed;z-index:30;font-size:44px;border:0;background:none;animation:fl 1.8s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-18px) rotate(10deg)}}
#cv{display:block;width:100%;height:min(72vh,640px);border-radius:20px;background:#0b0618;touch-action:none;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;border:1px solid var(--line);border-radius:99px;padding:9px 18px;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:var(--bg);display:none;z-index:40;overflow:auto}
.modal .box{max-width:720px;margin:0 auto;padding:16px}
.edit{display:grid;grid-template-columns:200px 1fr;gap:16px}
.edit .av{width:200px;height:240px;border-radius:22px;overflow:hidden;position:sticky;top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on,.pill.on{outline:3px solid #fff;outline-offset:1px}
.pill{border-radius:99px;padding:5px 12px;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:14px}
.lab{font-size:13px;color:var(--mu);margin:12px 0 5px}
input[type=text]{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:9px 12px;font:inherit;width:100%}
.jury{display:grid;gap:6px;margin-top:8px}
.jury div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-size:14px}
.stars{font-size:28px}
@media(max-width:560px){.edit{grid-template-columns:1fr}.edit .av{position:static;margin:0 auto}}
</style>
</head>

      var t = right >= 9 ? 'Wissens-Diva! Du gehörst auf die Bühne.' : right >= 6 ? 'Stark. Du bekommst einen Sekt aufs Haus.' : right >= 3 ? 'Brunch-Statist mit Potenzial.' : 'Zum Glück zählt beim Brunch nur der Auftritt.';
      root.innerHTML = '<div class="panel" style="text-align:center"><div class="big">' + right + ' / 10</div><p>' + t + '</p><p>' + score + ' Punkte' + (pb ? ' · Neuer Rekord!' : '') + '</p><p class="sub">+' + g + ' Glitzer</p><div class="row" style="justify-content:center"><button class="btn pri" id="ag">Nochmal</button></div></div>';
      $('#ag').onclick = run;
    }
    stop = function () { clearInterval(tm); };
    q();
  }
  run();
}

document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
showHub();
})();
</script>
