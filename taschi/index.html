<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#111e32"><title>TASCHI · Die acht Lichter</title>
<style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color:#f8fbff;background:#111e32}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #ffdd6a}#top{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;align-items:start}#brand{font-weight:1000;letter-spacing:.17em;font-size:22px;text-shadow:0 2px 8px #000a}#sub{font-size:11px;letter-spacing:.23em;color:#fff9}#stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:end}.pill{background:#142840dd;padding:9px 12px;border-radius:16px;border:1px solid #ffffff30;backdrop-filter:blur(10px);font-size:13px}#tip{position:absolute;top:76px;left:16px;background:#112338b8;border-radius:12px;padding:8px 12px;font-size:13px;max-width:370px}#actions{position:absolute;right:20px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:end;max-width:65vw}.action{background:#fff;color:#20314a;font-weight:800;padding:13px 17px;border-radius:19px;box-shadow:0 7px 0 #b8c8d4}.action.primary{background:#f9ce55;box-shadow:0 7px 0 #a77c29}#joy{position:absolute;bottom:max(35px,env(safe-area-inset-bottom));left:22px;width:128px;height:128px;border:2px solid #ffffff88;border-radius:50%;background:#ffffff24;pointer-events:auto;touch-action:none;display:none}#nub{position:absolute;left:39px;top:39px;width:48px;height:48px;border-radius:50%;background:#ffffffc9}#panel{position:absolute;inset:0;background:#091b2dbb;display:none;pointer-events:auto;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(7px)}#panel.show{display:flex}#panel.battle{align-items:end;background:#08152728;backdrop-filter:none;padding:12px 12px max(12px,env(safe-area-inset-bottom))}#panel.battle #card{width:min(820px,98vw);max-height:53vh;padding:16px 20px;background:linear-gradient(145deg,#fcfffff2,#d9edf4f4);box-shadow:0 6px 55px #05152773}#panel.battle #options{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px}#panel.battle .option{min-height:42px;padding:11px}#panel.battle h1{font-size:23px}@media(max-width:600px){#panel.battle #card{max-height:54vh;padding:12px}#panel.battle .option{min-height:38px;padding:9px;font-size:12px}}#card{width:min(94vw,640px);max-height:87vh;overflow:auto;background:linear-gradient(155deg,#f9faff,#dae8eb);border:5px solid #fff;border-radius:28px;color:#173047;padding:24px;box-shadow:0 28px 90px #0008}h1{margin:0 0 8px;font-size:clamp(25px,5vw,38px)}h2{margin:0 0 10px}p{line-height:1.5}#options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px;margin-top:20px}.option{background:#183956;color:white;border-radius:16px;padding:15px;text-align:left;min-height:68px;font-weight:750}.option:hover{background:#275d79}.option:disabled{opacity:.4;cursor:not-allowed}.muted{opacity:.75;font-size:13px}.hp{height:11px;background:#adc2c8;border-radius:40px;overflow:hidden;margin:8px 0}.hp>span{height:100%;display:block;background:#36c18b}#message{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);background:#101b32ec;border:1px solid #ffffff30;border-radius:13px;padding:12px 17px;font-weight:650;min-width:250px;max-width:80vw;text-align:center;display:none}@media(pointer:coarse){#joy{display:block}#message{bottom:175px}#actions{max-width:55vw}.action{padding:11px 13px}}@media(max-width:580px){#brand{font-size:16px}#sub{font-size:9px}#stats .pill{font-size:11px;padding:7px}#tip{top:65px;font-size:11px;max-width:70vw}#card{padding:17px}}
</style></head><body><div id="hud"><div id="top"><div><div id="brand">TASCHI <span style="color:#ffce59">✦</span></div><div id="sub">DIE ACHT LICHTER</div></div><div id="stats"><div class="pill" id="location">Sonnenhain</div><div class="pill" id="badge">✦ 0/8</div><div class="pill" id="count">◉ 0</div></div></div><div id="objective" style="position:absolute;top:128px;left:16px;background:#122d3edb;border:1px solid #ffffff3b;border-radius:13px;padding:9px 12px;font-size:13px;font-weight:700;max-width:80vw"></div><div id="tip">WASD / Pfeiltasten bewegen · E interagieren · im Gras Taschis finden</div><div id="message"></div><div id="joy"><div id="nub"></div></div><div id="actions"><button class="action" id="menu">☰</button><button class="action" id="map">Karte</button><button class="action" id="team">Team</button><button class="action" id="dex">Taschidex</button><button class="action primary" id="interact">Aktion · E</button></div><div id="panel"><div id="card"><h1 id="title"></h1><div id="desc"></div><div id="options"></div></div></div></div><script src="../bunte-insel/vendor/three.min.js"></script><script type="module">
import('./game.js').catch(error=>{
 console.error('Taschi could not start:',error);
 const p=document.getElementById('panel'),title=document.getElementById('title'),desc=document.getElementById('desc'),opt=document.getElementById('options');
 title.textContent='Die 3D-Welt konnte nicht geladen werden';
 desc.textContent='Bitte prüfe deine Internetverbindung und lade die Seite neu. Der 3D-Motor wird aus Bunte Insel lokal geladen. Technischer Hinweis: '+(error?.message||'Modul-Ladefehler');
 opt.replaceChildren();const b=document.createElement('button');b.className='option';b.textContent='Erneut versuchen';b.onclick=()=>location.reload();opt.appendChild(b);p.classList.add('show');
});
</script></body></html>
