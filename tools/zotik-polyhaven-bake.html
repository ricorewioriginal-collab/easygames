    const ctr = [0, 1, 2].map(j => m[j] + [0, 1, 2].reduce((s, k) => s + E[k][j] * (mn[k] + mx[k]) / 2, 0)), half = [0, 1, 2].map(k => (mx[k] - mn[k]) / 2 + .02);
    const meshes = src.map((q, qi) => { if (!c.idx[qi].length) return null; const g = new T.BufferGeometry(); for (const n in q.g.attributes) g.setAttribute(n, q.g.attributes[n]); g.setIndex(new T.BufferAttribute(new Uint32Array(c.idx[qi]), 1)); const me = new T.Mesh(g, basic(q.o.material)); me.matrixAutoUpdate = false; me.matrix.copy(q.o.matrixWorld); me.frustumCulled = false; return me; }).filter(Boolean);
    // Karte A: Ebene (e1,e2), Blick entlang e3; Karte B: Ebene (e1,e3), Blick entlang e2
    for (const [iu, iv, iw] of (cfg.one ? [[0, 1, 2]] : [[0, 1, 2], [0, 2, 1], [1, 2, 0]])) { if (half[iv] < .12 * half[iu] || half[iu] * half[iv] < 1e-4) continue; cards.push({ c: ctr, u: E[iu], v: E[iv], w: E[iw], hu: half[iu], hv: half[iv], hw: half[iw], meshes, n: c.n }); } }
  // Packen
  const pack = s => { const L = cards.map((q, i) => ({ i, w: Math.ceil(q.hu * 2 * s) + 4, h: Math.ceil(q.hv * 2 * s) + 4 })).sort((a, b) => b.h - a.h); let x = 0, y = 0, rh = 0; for (const q of L) { if (q.w > RT) return null; if (x + q.w > RT) { x = 0; y += rh; rh = 0; } q.x = x; q.y = y; x += q.w; rh = Math.max(rh, q.h); if (y + q.h > RT) return null; } return L; };
  let lo = 1, hi = 4000, P = null; for (let it = 0; it < 24; it++) { const mid = (lo + hi) / 2, r = pack(mid); if (r) { lo = mid; P = r; } else hi = mid; }

window.ready = true;
</script>
