<script type="module">

const NAMES = { m_idle_neutral_01:'rb_idle', m_idle_look_around_01:'rb_idle2', m_walk_neutral_01:'rb_walk', m_run_neutral_01:'rb_run', m_cheer_01:'rb_cheer', m_sit_chair_idle_neutral_01:'rb_sit', m_wave_01:'rb_wave', m_crouch_idle:'rb_crouch', m_claphands_01:'rb_clap',

  for (const t of keep) if (t.name === 'Bip01.position') { const v = t.values; for (let i = 0; i < v.length; i += 3) { v[i] = 0; v[i + 2] = 0; } }

  const MAX = { rb_idle: 8, rbf_idle: 8, rb_cheer: 5, rbf_cheer: 5, rb_sit: 9, rbf_sit: 9, rb_crouch: 5, rb_clap: 4 }[n];

    const at = (t, time) => { const i = t.createInterpolant(); return i.evaluate(time).slice(); };

    for (let tm = MAX * 0.55; tm <= MAX; tm += 1 / 30) { let d = 0; for (const t of qt) { const a0 = at(t, 0), a1 = at(t, tm); const dot = Math.abs(a0[0]*a1[0]+a0[1]*a1[1]+a0[2]*a1[2]+a0[3]*a1[3]); d += 1 - Math.min(1, dot); } if (d < bd) { bd = d; best = tm; } }

const sp = {}; skel.traverse(o => { if (o.name === 'Bip01' || o.name === 'Bip01_Pelvis') sp[o.name] = o.position.toArray().map(v => +v.toFixed(1)); });

</script>
