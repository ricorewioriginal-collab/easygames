<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Urwaldlager – Die Promi-Show">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#7a1f4a"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c2"/><stop offset=".45" stop-color="#ffd23a"/><stop offset="1" stop-color="#ff9e1f"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cff6a"/><stop offset="1" stop-color="#1f8a3e"/></linearGradient>
    <clipPath id="sun"><circle cx="320" cy="150" r="118"/></clipPath>
  </defs>
  <!-- Sonne mit Dschungel-Silhouette -->
  <circle cx="320" cy="150" r="118" fill="url(#sky)"/>
  <g clip-path="url(#sun)" fill="#0d2a1a">
    <path d="M190 240 Q230 190 270 215 Q300 175 340 205 Q380 170 420 210 Q450 190 470 240 Z"/>
    <path d="M200 268 Q240 150 300 196 Q330 160 360 194 Q410 140 450 268 Z" opacity=".55"/>
  </g>
  <!-- Palmen links und rechts -->
  <g fill="url(#leaf)" stroke="#0d2a1a" stroke-width="5" stroke-linejoin="round">
    <path d="M96 230 Q104 150 132 96" fill="none" stroke="#6b4426" stroke-width="13" stroke-linecap="round"/>
    <path d="M132 96 Q86 70 40 96 Q90 92 128 104 Z"/><path d="M132 96 Q150 46 204 44 Q164 66 138 102 Z"/><path d="M132 96 Q186 86 214 128 Q170 104 134 104 Z"/><path d="M132 96 Q98 112 84 160 Q110 120 136 104 Z"/>
    <path d="M544 230 Q536 150 508 96" fill="none" stroke="#6b4426" stroke-width="13" stroke-linecap="round"/>
    <path d="M508 96 Q554 70 600 96 Q550 92 512 104 Z"/><path d="M508 96 Q490 46 436 44 Q476 66 502 102 Z"/><path d="M508 96 Q454 86 426 128 Q470 104 506 104 Z"/><path d="M508 96 Q542 112 556 160 Q530 120 504 104 Z"/>
  </g>
  <!-- Sterne -->
  <g fill="#ffd23a" stroke="#0d2a1a" stroke-width="4" stroke-linejoin="round">
    <path d="M320 34 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3 z"/>
    <path transform="translate(-92 22) scale(.6)" d="M320 34 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3 z"/>
    <path transform="translate(220 22) scale(.6)" d="M320 34 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3 z"/>
  </g>
  <!-- Wortmarke -->
  <g font-family="'Arial Black', 'Segoe UI Black', system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="320" y="282" font-size="80" textLength="572" lengthAdjust="spacingAndGlyphs" fill="#0d2a1a" stroke="#0d2a1a" stroke-width="22" stroke-linejoin="round">URWALDLAGER</text>
    <text x="320" y="282" font-size="80" textLength="572" lengthAdjust="spacingAndGlyphs" fill="url(#word)" stroke="#5a2a10" stroke-width="3">URWALDLAGER</text>
  </g>
  <!-- Band -->
  <g>
    <path d="M150 304 H490 L474 330 L490 356 H150 L166 330 Z" fill="#d8402e" stroke="#0d2a1a" stroke-width="5" stroke-linejoin="round"/>
    <text x="320" y="340" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#fff" text-anchor="middle" letter-spacing="3">DIE PROMI-SHOW</text>
  </g>
</svg>
