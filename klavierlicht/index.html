<title>Klavierlicht – Klavier spielen mit Kacheln und Lichtern</title>
<meta name="description" content="Klavierlicht: über 100 bekannte Lieder auf dem Klavier spielen – Kacheln im Takt tippen wie bei Piano Tiles oder leuchtende Lichter wie bei Magic Piano. Spielmodi Klassisch mit Kronen-Runden, Magie, Klavier lernen mit Lernpfad und Notenzeile, Freies Klavier mit Aufnahme und Begleitautomatik, Online-Battle und Duett mit zwei Geräten, Turnier der Woche, Endlos, Üben, Tages-Challenge und Zuhören; Leicht, Mittel, Schwer mit Sternen und Kronen. Kinderlieder, Weihnachtslieder, Volksweisen, Bach-Choräle und Klassik (Für Elise, Maple Leaf Rag, Kanon in D, La donna è mobile …), alle gemeinfrei mit Rechte-Angabe. Touch, Tastatur und Controller.">
