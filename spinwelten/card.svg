<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1b3d"/><stop offset="0.55" stop-color="#2a5a9a"/><stop offset="1" stop-color="#7ec8e8"/></linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd06a"/><stop offset="1" stop-color="#3e9a52"/></linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08a62"/><stop offset="1" stop-color="#5b3d2a"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="45%"><stop offset="0" stop-color="#bff8ff"/><stop offset="1" stop-color="#2ec4a6"/></radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%"><stop offset="0" stop-color="#fff4c2" stop-opacity="0.9"/><stop offset="1" stop-color="#fff4c2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.8"><circle cx="60" cy="40" r="1.6"/><circle cx="140" cy="80" r="1.2"/><circle cx="250" cy="30" r="1.4"/><circle cx="520" cy="50" r="1.6"/><circle cx="590" cy="110" r="1.2"/><circle cx="420" cy="24" r="1"/></g>
  <!-- kleine Nebeninsel -->
  <g transform="translate(520 210)"><ellipse rx="44" ry="11" fill="url(#grass)"/><path d="M-44 0 Q-20 50 0 66 Q22 48 44 0Z" fill="url(#rock)"/><circle cx="-8" cy="-14" r="12" fill="#3e9a52"/><rect x="-10" y="-6" width="4" height="8" fill="#8a5a35"/></g>
  <!-- Hauptinsel -->
  <g transform="translate(250 250)">
    <path d="M-170 0 Q-120 120 -20 150 Q10 175 30 150 Q140 110 170 0Z" fill="url(#rock)"/>
    <path d="M-150 30 Q-90 60 -40 52 M40 60 Q100 52 150 26" stroke="#6d5b4c" stroke-width="6" fill="none" opacity="0.6"/>
    <ellipse rx="172" ry="40" fill="url(#grass)"/>
    <ellipse cx="-50" cy="-6" rx="60" ry="14" fill="#8fe07a" opacity="0.45"/>
    <!-- Leuchtturm -->
    <g transform="translate(-95 -10)"><path d="M-14 0 L-9 -96 L9 -96 L14 0Z" fill="#f6ecd9"/><rect x="-12" y="-40" width="24" height="9" fill="#ff7f6b"/><rect x="-10" y="-72" width="20" height="8" fill="#ff7f6b"/><rect x="-12" y="-110" width="24" height="16" rx="3" fill="#fff4c2"/><circle cy="-102" r="26" fill="url(#halo)"/><path d="M-14 -110 L0 -128 L14 -110Z" fill="#ffcf5a"/></g>
    <!-- Haus mit Dach -->
    <g transform="translate(70 -12)"><rect x="-30" y="-40" width="60" height="40" rx="5" fill="#efe4f6"/><path d="M-38 -38 L0 -72 L38 -38Z" fill="#c0603a"/><rect x="-8" y="-22" width="16" height="22" rx="3" fill="#9a6a3f"/><rect x="14" y="-32" width="10" height="10" rx="2" fill="#ffe08a"/></g>
    <!-- Bäume -->
    <g fill="#3e9a52"><circle cx="-20" cy="-26" r="18"/><circle cx="-4" cy="-34" r="14" fill="#5fbf5a"/><circle cx="135" cy="-18" r="14"/></g>
    <rect x="-22" y="-12" width="5" height="12" fill="#8a5a35"/>
    <!-- Kristalle unten -->
    <path d="M-30 150 L-22 186 L-14 150Z M40 140 L46 170 L52 140Z" fill="#bfefff" opacity="0.85"/>
  </g>
  <!-- Runen-Emblem -->
  <g transform="translate(470 110)">
    <circle r="56" fill="url(#halo)"/>
    <circle r="40" fill="#14295a" stroke="#d8b26a" stroke-width="5"/>
    <path d="M0 -30 L6 -6 L30 0 L6 6 L0 30 L-6 6 L-30 0 L-6 -6Z" fill="#f2d08a"/>
    <circle r="9" fill="url(#core)"/>
  </g>
  <!-- Kivi -->
  <g transform="translate(330 120)"><circle r="17" fill="#d8f6ff" opacity="0.55"/><circle r="12" fill="#3fd8e8"/><circle cx="-5" cy="-2" r="3.4" fill="#fff"/><circle cx="5" cy="-2" r="3.4" fill="#fff"/><circle cx="-5" cy="-1" r="1.7" fill="#14204a"/><circle cx="5" cy="-1" r="1.7" fill="#14204a"/><ellipse cx="-20" cy="2" rx="9" ry="3" fill="#7bd88f"/><ellipse cx="20" cy="2" rx="9" ry="3" fill="#7bd88f"/></g>
  <text x="320" y="370" text-anchor="middle" font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif" font-weight="700" font-size="44" fill="#f2d08a" stroke="#0d1b3d" stroke-width="6" paint-order="stroke">Spinwelten 3D</text>
</svg>
