<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5c94fc"><title>Lumo – Wolkenpfad</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:16px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}
body{height:100dvh}
main{position:absolute;inset:0;display:grid;place-items:center;background:#000}
canvas{display:block;width:min(100vw,calc(100dvh * 256 / 240));height:auto;aspect-ratio:256/240;image-rendering:pixelated}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:2px solid #fff;background:#1d2b53;border-radius:6px;padding:8px 12px;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #ffec27;outline-offset:3px}
#bar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:6px 8px;background:linear-gradient(#000a,#0000)}
#bar button{font-size:13px;padding:6px 10px;background:#000c}
#bar a{font-size:13px;padding:6px 10px;border:2px solid #fff;border-radius:6px;background:#000c;text-decoration:none}
#panel{position:absolute;inset:auto 0 0;z-index:4;display:none;justify-content:center;padding:10px;background:#000d}
#panel.show{display:flex}
#panel .box{width:min(560px,100%);display:grid;gap:8px;text-align:center}
#panel p{margin:0;font-size:13px;line-height:1.5;color:#e8e8e8}
#panel details{text-align:left;font-size:13px}
#panel summary{cursor:pointer;padding:6px}
#cloudMount{margin-top:6px}
.controls{position:absolute;inset:auto 0 0;z-index:2;display:flex;align-items:end;justify-content:space-between;padding:14px max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));pointer-events:none}
.dpad{display:flex;gap:10px}
.dpad button,.jump{pointer-events:auto;font-size:26px;font-weight:900;background:#ffffff33;border:3px solid #ffffffaa;color:#fff;width:72px;height:72px;padding:0;border-radius:50%;touch-action:none}
.jump{width:88px;height:88px;background:#e52521aa;border-color:#ffffffcc}
.controls button:active{filter:brightness(1.4)}
body.playing .controls{display:flex}
body:not(.playing) .controls{display:none}
@media(max-height:480px){.dpad button,.jump{width:58px;height:58px;font-size:20px}.jump{width:70px;height:70px}}
</style></head>
<body>
<main>
  <canvas id="game" width="256" height="240" aria-label="Lumo Wolkenpfad"></canvas>
</main>
<div id="bar">
  <button id="sound" aria-pressed="true" aria-label="Ton umschalten">♫ An</button>
  <button id="pause" aria-label="Pause">Ⅱ Pause</button>
  <button id="fullscreen" aria-label="Vollbild">⛶</button>
  <a href="../" target="_top">← Spiele</a>
</div>
<div id="panel" role="dialog" aria-live="polite"><div class="box">
  <p id="message"></p>
  <details id="cloudDetails"><summary>☁ Google-Speicher &amp; Spielstand</summary><p id="saveStatus">Dein Fortschritt wird automatisch lokal gespeichert.</p><div id="cloudMount"></div></details>
</div></div>
<div class="controls" aria-label="Spielsteuerung">
  <div class="dpad" role="group" aria-label="Steuerkreuz"><button data-key="left" aria-label="Links">◀</button><button data-key="right" aria-label="Rechts">▶</button></div>
  <button class="jump" data-key="jump" aria-label="Springen">A</button>
</div>
<script src="audio.js"></script><script src="game.js"></script><script src="../cloud/anmacha-cloud.js" data-game="lumo" data-prefix="easygames.lumo.v1" data-mount="#cloudMount" data-hint="Mit Google anmelden: Fortschritt, Bestwerte und Leben geräteübergreifend speichern." defer></script>
</body></html>
