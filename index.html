<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<title>easygames – Minispiele</title>
<style>
  *{box-sizing:border-box}
  :root{--cy:#00E5FF;--ma:#FF2D95;--pu:#8B5CF6}
  html,body{margin:0;min-height:100%;background:#080B12;color:#fff;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.45}
  body{background:
    radial-gradient(900px 500px at 10% -10%,rgba(0,229,255,.18),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(255,45,149,.16),transparent 60%),
    radial-gradient(800px 600px at 50% 110%,rgba(139,92,246,.18),transparent 60%),#080B12;
    background-attachment:fixed;min-height:100vh}
  button{font:inherit;color:inherit;cursor:pointer}
  .hidden{display:none!important}
  main{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 56px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:26px}
  h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:900;font-style:italic;letter-spacing:.01em;
    background:linear-gradient(90deg,var(--cy),var(--pu),var(--ma));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brandrow{display:flex;align-items:center;gap:16px}
  [hidden]{display:none!important}
  .brand{max-height:64px;max-width:200px;width:auto;height:auto;filter:drop-shadow(0 0 12px rgba(255,255,255,.25))}
  .sub{margin:2px 0 0;color:#9fb4c8;font-size:15px}
  .pill{border:1px solid rgba(0,229,255,.45);background:rgba(255,255,255,.04);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;color:var(--cy)}
  .pill:hover{background:rgba(0,229,255,.12)}

  /* App-Kacheln */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 18px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:0;padding:6px;text-align:center;border-radius:20px;
    transition:transform .15s}
  .tile:hover{transform:translateY(-4px)}
  .tile:active{transform:scale(.96)}
  .tile:focus-visible{outline:2px solid var(--cy);outline-offset:4px}
  .icon{position:relative;width:min(100%,132px);aspect-ratio:1;border-radius:28%;display:flex;align-items:center;justify-content:center;
    font-size:clamp(46px,9vw,64px);box-shadow:0 14px 30px rgba(0,0,0,.5),0 0 28px var(--g,rgba(0,229,255,.35)),inset 0 2px 0 rgba(255,255,255,.35),inset 0 -10px 22px rgba(0,0,0,.25);overflow:hidden}
  .icon::after{content:'';position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0))}
  .icon span{filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));position:relative;z-index:1}
  .tile b{font-size:16px}
  .tile small{color:#9fb4c8;font-size:12.5px;line-height:1.35;max-width:170px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ext{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;background:rgba(0,0,0,.45);border-radius:8px;padding:1px 6px}

  section.lib{margin-top:44px;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.22);border-radius:18px;padding:16px}
  section.lib h2{margin:0 0 4px;font-size:18px}
  textarea{width:100%;height:92px;background:#04070d;color:#9ff;border:1px solid rgba(0,229,255,.3);border-radius:10px;
    font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;resize:vertical}
  .primary{border:0;color:#04141a;font-weight:800;background:linear-gradient(90deg,var(--cy),var(--pu),var(--ma));border-radius:999px;padding:10px 22px}

  /* App-Fenster */
  #viewer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:rgba(4,6,12,.86);backdrop-filter:blur(6px)}
  #win{display:flex;flex-direction:column;flex:1;min-height:0;margin:0;background:#080B12;overflow:hidden}
  @media (min-width:900px) and (min-height:640px){#viewer{padding:3vh 3vw}#win{border-radius:20px;border:1px solid rgba(0,229,255,.4);box-shadow:0 0 60px rgba(0,229,255,.2)}}
  #bar{display:flex;align-items:center;gap:8px;padding:8px 10px calc(8px) 10px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);padding-top:calc(8px + env(safe-area-inset-top))}
  #bar .t{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .ib{height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid rgba(0,229,255,.4);background:rgba(255,255,255,.04);font-weight:700;font-size:14px;white-space:nowrap}
  .ib:hover{background:rgba(0,229,255,.14)}
  .ib .l{display:none}
  @media (min-width:640px){.ib .l{display:inline}}
  #frame{flex:1;width:100%;border:0;background:#000;min-height:0}
  #win:fullscreen{border-radius:0;border:0}

  /* Teilen */
  #share{position:fixed;inset:0;z-index:30;display:flex;padding:16px;background:rgba(4,6,12,.8);overflow:auto}
  #share .box{margin:auto;width:100%;max-width:520px;background:#0c1220;border:1px solid rgba(0,229,255,.4);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
  #share h3{margin:0;font-size:20px}
  #share label{font-size:13px;color:#9fb4c8}
  #share input{width:100%;font:13px ui-monospace,Menlo,Consolas,monospace;padding:10px;border-radius:10px;border:1px solid rgba(0,229,255,.3);background:#04070d;color:#9ff}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  body.embed-mode .hide-embed{display:none}
  body.embed-mode main{padding-top:12px}
</style>
</head>
<body>
<main>
  <header class="hide-embed">
    <div class="brandrow"><img id="brandImg" class="brand" alt="Logo" hidden><div><h1>easygames</h1><p class="sub">Kleine Spiele für Browser und Handy – antippen und loslegen.</p></div></div>
    <button class="pill" id="libBtn">&lt;/&gt; Alle Spiele einbetten</button>
  </header>

  <div class="grid" id="grid"></div>

  <section class="lib hide-embed hidden" id="lib">
    <h2>Komplette Spielebibliothek einbetten</h2>
    <p class="sub" style="margin-bottom:8px">Diesen Code auf einer beliebigen Webseite einfügen – die Kacheln erscheinen dort.</p>
    <textarea id="libCode" readonly></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" data-copy="libCode">Code kopieren</button></div>
  </section>
</main>

<div id="viewer" class="hidden">
  <div id="win">
    <div id="bar">
      <button class="ib" id="vClose" aria-label="Schließen">✕<span class="l">&nbsp;Schließen</span></button>
      <button class="ib" id="vPrev" aria-label="Voriges Spiel">◀</button>
      <div class="t" id="vTitle"></div>
      <button class="ib" id="vNext" aria-label="Nächstes Spiel">▶</button>
      <button class="ib" id="vFs" aria-label="Vollbild">⛶<span class="l">&nbsp;Vollbild</span></button>
      <button class="ib" id="vShare" aria-label="Teilen">⤴<span class="l">&nbsp;Teilen</span></button>
    </div>
    <iframe id="frame" allow="fullscreen; autoplay" title="Spiel"></iframe>
  </div>
</div>

<div id="share" class="hidden">
  <div class="box">
    <h3 id="sTitle">Teilen</h3>
    <label for="sLink">Direkter Link zum Spiel</label>
    <input id="sLink" readonly>
    <div class="row"><button class="primary" data-copy="sLink">Link kopieren</button><button class="ib" id="sNative">Teilen …</button><a class="ib" id="sOpen" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit">Neuer Tab ↗</a></div>
    <label for="sCode">Einbetten (iframe)</label>
    <textarea id="sCode" readonly></textarea>
    <div class="row"><button class="primary" data-copy="sCode">Code kopieren</button><button class="ib" id="sClose" style="margin-left:auto">Schließen</button></div>
  </div>
</div>

<script>
// Neues Spiel? Hier einen Eintrag ergänzen. "path" = Ordner im Repo oder komplette URL.
const GAMES = [
  { id: 'anmacha-radio-surfer', title: 'AnMaCha Radio Surfer', icon: '📻', bg: 'linear-gradient(145deg,#00ff66,#19f0ff)', glow: 'rgba(0,255,150,.5)',
    path: 'anmacha-radio-surfer/', desc: '3D-Runner durchs Internet: springen, rutschen, ausweichen – 10 Level.' },
  { id: 'anmacha-flipper', title: 'AnMaCha Pinball', icon: '🎱', bg: 'linear-gradient(145deg,#00E5FF,#8B5CF6 55%,#FF2D95)', glow: 'rgba(139,92,246,.55)',
    path: 'anmacha-flipper/', desc: '3D-Pinball mit 13 Tischen: Kampagne mit steigender Schwierigkeit oder freies Spiel.' },
  { id: 'anmacha-beat-surfer', title: 'AnMaCha Beat Surfer', icon: '🎧', bg: 'linear-gradient(145deg,#FF2D95,#8B5CF6 55%,#00E5FF)', glow: 'rgba(255,45,149,.5)',
    path: 'anmacha-beat-surfer/', desc: '3D-Rhythmusspiel: Triff die Noten im Takt – 13 Songs, steigende Schwierigkeit.' },
  { id: 'anmacha-memory', title: 'AnMaCha Memory', icon: '🃏', bg: 'linear-gradient(145deg,#FF9A1F,#FF2D95 55%,#8B5CF6)', glow: 'rgba(255,45,149,.5)',
    path: 'anmacha-memory/', desc: 'Memory mit unseren Sender-Logos: 10 Level mit Mischer & Zeitlimit, freies Spiel und Duell.' },
  { id: 'anmacha-quest-rpg', title: 'AnMaCha Quest RPG', icon: '⚔️', bg: 'linear-gradient(145deg,#2a3cff,#8B5CF6 55%,#FF9A1F)', glow: 'rgba(80,100,255,.55)',
    path: 'anmacha-quest-rpg/', desc: '3D-Rollenspiel (Godot): 5 Helden, animierte Monster, Oberwelt, Dungeons mit Schlüsseln, Bosse.' },
  { id: 'anmacha-snake', title: 'AnMaCha Snake 3D', icon: '🐍', bg: 'linear-gradient(145deg,#00e5ff,#2a6cff 55%,#FF2D95)', glow: 'rgba(0,229,255,.5)',
    path: 'anmacha-snake/', desc: '3D-Snake: friss Sender-Logos, 13 Welten, Power-ups, Portal-Modus, zwei Kameras.' },
  { id: 'zotik', title: 'ZOTIK', icon: '💠', bg: 'linear-gradient(145deg,#7a3cff,#19f0ff)', glow: 'rgba(25,240,255,.45)', external: true,
    path: 'https://ricorewioriginal-collab.github.io/zotik/', desc: 'Die Splitter der Welten – Browser-Spiel.' }
];

const $ = id => document.getElementById(id);
// Haupt-Logo (optional): logo.png / .jpg / .jpeg / .svg / .webp im Hauptordner
(function () {
  const exts = ['png', 'jpg', 'jpeg', 'svg', 'webp'];
  Promise.all(exts.map(e => new Promise(res => { const im = new Image(); im.onload = () => res(im.src); im.onerror = () => res(null); im.src = 'logo.' + e; })))
    .then(l => { const src = l.find(Boolean); if (src) { $('brandImg').src = src; $('brandImg').hidden = false; } });
})();
const base = new URL('.', location.href).href;
const abs = p => new URL(p, base).href;
const iframeCode = (url, title) =>
  `<iframe src="${url}" title="${title}" allow="fullscreen; autoplay" loading="lazy"\n  style="width:100%;max-width:960px;aspect-ratio:16/10;border:0;border-radius:12px"></iframe>`;
const embedMode = new URLSearchParams(location.search).has('embed');
if (embedMode) document.body.classList.add('embed-mode');

// ----- Kacheln -----
GAMES.forEach((g, i) => {
  const b = document.createElement('button');
  b.className = 'tile'; b.dataset.i = i;
  b.innerHTML = `<div class="icon" style="background:${g.bg};--g:${g.glow}">${g.external ? '<div class="ext">extern</div>' : ''}<span>${g.icon}</span></div><b></b><small></small>`;
  b.querySelector('b').textContent = g.title; b.querySelector('small').textContent = g.desc;
  b.addEventListener('click', () => openGame(i));
  $('grid').appendChild(b);
});
$('libCode').value = iframeCode(base + '?embed=1', 'easygames – Spielebibliothek');
$('libBtn').addEventListener('click', () => $('lib').classList.toggle('hidden'));

// ----- App-Fenster -----
let cur = -1;
function openGame(i, fromHash) {
  cur = (i + GAMES.length) % GAMES.length;
  const g = GAMES[cur], url = abs(g.path);
  $('vTitle').textContent = g.title;
  $('frame').title = g.title;
  $('frame').src = url;
  $('viewer').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  if (!fromHash) history.replaceState(null, '', '#' + g.id);
}
function closeGame() {
  if (document.fullscreenElement) document.exitFullscreen();
  $('viewer').classList.add('hidden'); $('frame').src = 'about:blank';
  document.body.style.overflow = ''; cur = -1;
  history.replaceState(null, '', location.pathname + location.search);
}
$('frame').addEventListener('load', () => { try { $('frame').contentWindow.focus(); } catch (e) {} });
$('vClose').addEventListener('click', closeGame);
$('vPrev').addEventListener('click', () => openGame(cur - 1));
$('vNext').addEventListener('click', () => openGame(cur + 1));
$('vFs').addEventListener('click', () => {
  const el = $('win'), req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (req) { req.call(el).catch(() => { location.href = abs(GAMES[cur].path); }); }
  else location.href = abs(GAMES[cur].path);          // z. B. iPhone: Spiel direkt als ganze Seite öffnen
});

// ----- Teilen -----
function openShare() {
  const g = GAMES[cur], url = abs(g.path);
  $('sTitle').textContent = g.title + ' teilen';
  $('sLink').value = url; $('sCode').value = iframeCode(url, g.title); $('sOpen').href = url;
  $('sNative').classList.toggle('hidden', !navigator.share);
  $('share').classList.remove('hidden');
}
$('vShare').addEventListener('click', openShare);
$('sClose').addEventListener('click', () => $('share').classList.add('hidden'));
$('sNative').addEventListener('click', () => navigator.share({ title: GAMES[cur].title, url: abs(GAMES[cur].path) }).catch(() => {}));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-copy]'); if (!t) return;
  const ta = $(t.dataset.copy); ta.focus(); ta.select();
  (navigator.clipboard ? navigator.clipboard.writeText(ta.value) : Promise.reject()).catch(() => document.execCommand('copy'));
  const old = t.textContent; t.textContent = 'Kopiert ✓'; setTimeout(() => t.textContent = old, 1500);
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('share').classList.contains('hidden')) $('share').classList.add('hidden');
  else if (!$('viewer').classList.contains('hidden')) closeGame();
});

// Direktlink zur Spieleliste: ...#anmacha-flipper öffnet das Spiel gleich
const start = GAMES.findIndex(g => '#' + g.id === location.hash);
if (start >= 0) openGame(start, true);
</script>
</body>
</html>
