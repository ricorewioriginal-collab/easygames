<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1670"/><stop offset=".6" stop-color="#3b2aa6"/><stop offset="1" stop-color="#16a6c9"/></linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="body" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#bff7ff"/><stop offset="1" stop-color="#4fc9f0"/></radialGradient>
    <g id="b"><circle r="30"/><circle r="30" fill="url(#shine)"/></g>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g opacity=".18" fill="#fff"><circle cx="70" cy="330" r="4"/><circle cx="560" cy="60" r="3"/><circle cx="600" cy="300" r="5"/><circle cx="40" cy="120" r="3"/></g>
  <!-- Blasen-Wand oben -->
  <g>
    <use href="#b" x="200" y="34" fill="#ff3b52"/><use href="#b" x="260" y="34" fill="#ff3b52"/><use href="#b" x="320" y="34" fill="#ffd21f"/><use href="#b" x="380" y="34" fill="#2f7bff"/><use href="#b" x="440" y="34" fill="#2f7bff"/>
    <use href="#b" x="230" y="86" fill="#2fd46a"/><use href="#b" x="290" y="86" fill="#ffd21f"/><use href="#b" x="350" y="86" fill="#b45cff"/><use href="#b" x="410" y="86" fill="#1fe0e0"/>
