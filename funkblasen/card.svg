    <text x="320" y="232" font-size="80" textLength="540" lengthAdjust="spacingAndGlyphs"><tspan fill="#ffd21f">FUNK</tspan><tspan fill="#5ff3ff">BLASEN</tspan></text>
    <text x="320" y="270" font-size="22" fill="#e9e4ff" font-weight="500">Das große Bubble-Shooter-Abenteuer</text>
  </g>
  <!-- Funki -->
  <g transform="translate(250 278) scale(.95)">
    <ellipse cx="60" cy="122" rx="30" ry="6" fill="rgba(0,0,0,.25)"/>
    <path d="M60 12c26 0 42 20 42 46 0 22-8 34-18 44 4 6 10 10 10 10s-14 2-24-4c-4 1-7 1-10 1-26 0-42-20-42-51S34 12 60 12z" fill="url(#body)"/>
    <path d="M22 56c0-26 16-44 38-44s38 18 38 44" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/>
    <rect x="10" y="48" width="18" height="26" rx="8" fill="#ff8a3d"/><rect x="92" y="48" width="18" height="26" rx="8" fill="#ff8a3d"/>
    <ellipse cx="47" cy="60" rx="6" ry="8" fill="#1b1530"/><ellipse cx="73" cy="60" rx="6" ry="8" fill="#1b1530"/>
    <circle cx="49" cy="57" r="2" fill="#fff"/><circle cx="75" cy="57" r="2" fill="#fff"/>
    <path d="M50 76q10 9 20 0" fill="none" stroke="#1b1530" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 12v-6" stroke="#ff8a3d" stroke-width="3"/><circle cx="60" cy="5" r="4" fill="#ff5a5a"/>
