<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<title>AnMaCha Pinball</title>
<style>
  *{box-sizing:border-box}
  :root{--c:#00E5FF;--ma:#FF2D95;--pu:#8B5CF6}
  html,body{margin:0;height:100%;overflow:hidden;background:#080B12;color:#fff;overscroll-behavior:none;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  canvas#gl{display:block;position:fixed;inset:0;width:100%;height:100%}
  button{font:inherit;color:#fff;cursor:pointer;touch-action:none}
  .hidden{display:none!important}
  .glass{background:rgba(12,17,32,.58);border:1px solid rgba(255,255,255,.12);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
  .lbl{font-size:10.5px;letter-spacing:.22em;color:#8da2bb;font-weight:700}
  body.menu #hud,body.menu #touch,body.menu #hint,body.menu #meter,body.menu #pops{display:none!important}

  /* Anzeige (HUD) */
  #hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
  #hL,#hC{padding:8px 14px;display:flex;flex-direction:column;gap:1px}
  #hL{min-width:104px}
  #sideLogo{display:none;width:100%;aspect-ratio:1;border-radius:12px;margin-bottom:8px;background:#0b1018;box-shadow:0 0 28px var(--c)}
  #score{font:900 clamp(26px,6.6vw,40px)/1.05 'Trebuchet MS',system-ui,sans-serif;background:linear-gradient(90deg,#fff,var(--c));
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px var(--c));font-variant-numeric:tabular-nums}
  #best{font-size:11px;color:#9fb4c8}
  #tname{font-size:11px;color:var(--c);font-weight:700}
  #hC{align-items:center}
  #balls{display:flex;gap:6px;margin-top:3px}
  #balls i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#b8c6dc 45%,#4a5a74);box-shadow:0 0 9px var(--c)}
  #balls i.off{background:transparent;box-shadow:none;border:2px solid #34445c}
  #mult{font:900 clamp(15px,3.6vw,20px)/1 'Trebuchet MS',sans-serif;color:var(--ma);text-shadow:0 0 14px var(--ma);min-height:1em;margin-top:4px}
  #btns{display:flex;gap:8px;pointer-events:auto}
  .ib{width:44px;height:44px;border-radius:14px;font-size:18px;padding:0}
  .ib:active{background:rgba(0,229,255,.28)}
  /* Querformat am PC: Logo-Karte links, Kugeln/Multiplikator rechts */
  @media (max-width:430px){
    .ib{width:38px;height:38px;font-size:16px;border-radius:12px} #btns{gap:5px} #hud{gap:5px;padding-left:6px;padding-right:6px}
    #hC{padding:6px 9px} #balls i{width:12px;height:12px} #balls{gap:4px} #hL{min-width:0;padding:6px 10px} .lbl{letter-spacing:.14em}
  }
  @media (min-aspect-ratio:13/10) and (min-width:880px) and (min-height:601px){
    #hud{display:block;padding:0}
    #hL{position:fixed;left:clamp(16px,3vw,48px);top:50%;transform:translateY(-50%);width:clamp(200px,19vw,290px);padding:14px}
    #sideLogo{display:block}
    #hC{position:fixed;right:clamp(16px,3vw,48px);top:50%;transform:translateY(-50%);width:clamp(150px,13vw,200px);padding:14px}
    #hC #balls{gap:8px}
    #hR{position:fixed;top:16px;right:16px}
    #score{font-size:clamp(34px,3.6vw,52px)}
  }
  #meter{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(60vw,260px);height:10px;
    border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .15s}
  #meter.on{opacity:1}
  #meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,#00E5FF,#8B5CF6,#FF2D95)}
  #msg{position:fixed;left:0;right:0;top:34%;text-align:center;font:900 clamp(22px,6vw,44px)/1.1 'Trebuchet MS',sans-serif;
    text-shadow:0 0 18px var(--ma);opacity:0;pointer-events:none;padding:0 12px}
  #msg.show{animation:msg 1.6s ease forwards}
  @keyframes msg{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
  #pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .pop{position:absolute;color:#fff;font:900 20px 'Trebuchet MS',sans-serif;text-shadow:0 0 10px var(--c),0 0 3px var(--c);animation:pop .9s ease-out forwards;white-space:nowrap}
  @keyframes pop{0%{opacity:1;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,-46px) scale(1.2)}}
  #hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#7d90a6;pointer-events:none}
  body.touch #hint{display:none}

  /* Touch-Tasten */
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;gap:10px;justify-content:space-between;align-items:flex-end;
    padding:0 12px calc(14px + env(safe-area-inset-bottom))}
  body.touch #touch{display:flex}
  #touch button{border-radius:26px;border:1.5px solid rgba(0,229,255,.55);background:linear-gradient(180deg,rgba(0,229,255,.16),rgba(8,11,18,.5));
    font:900 clamp(15px,4.2vw,20px) 'Trebuchet MS',sans-serif;letter-spacing:.08em;box-shadow:0 0 18px rgba(0,229,255,.25),inset 0 1px 0 rgba(255,255,255,.2)}
  #touch button.down{background:rgba(0,229,255,.38)}
  #tL,#tR{flex:1;height:clamp(92px,17vh,130px)}
  #tR{border-color:rgba(255,45,149,.65)!important;background:linear-gradient(180deg,rgba(255,45,149,.16),rgba(8,11,18,.5))!important;box-shadow:0 0 18px rgba(255,45,149,.25),inset 0 1px 0 rgba(255,255,255,.2)}
  #tR.down{background:rgba(255,45,149,.4)!important}
  #tLaunch{width:26%;min-width:84px;height:clamp(72px,12vh,98px);border-color:rgba(139,92,246,.85)!important;
    background:linear-gradient(180deg,rgba(139,92,246,.22),rgba(8,11,18,.5))!important}
  #tLaunch.down{background:rgba(139,92,246,.45)!important}
  @media (orientation:landscape) and (max-height:600px){
    #hud{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px}
    #hR{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px}
    #hC{flex-direction:row;align-items:center;gap:10px;padding:6px 10px} #hC .lbl{display:none} #balls{margin-top:0} #mult{margin-top:0}
    body.touch #touch{display:block;pointer-events:none;padding:0}
    body.touch #touch button{position:fixed;pointer-events:auto}
    #tL{left:calc(10px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));width:30vw;height:38vh}
    #tR{right:calc(10px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));width:30vw;height:38vh}
    #tLaunch{right:calc(10px + env(safe-area-inset-right));bottom:calc(20px + 38vh + env(safe-area-inset-bottom));width:22vw;height:20vh;min-width:0}
    #meter{display:none}
  }

  /* Menü / Overlays */
  .ov{position:fixed;inset:0;overflow:auto;display:flex;padding:16px;
    background:radial-gradient(ellipse at 50% 30%,rgba(8,11,18,.45),rgba(8,11,18,.93) 75%)}
  .ov::before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(500px 300px at 15% 10%,var(--c),transparent 70%),radial-gradient(500px 300px at 90% 90%,var(--ma),transparent 70%);mix-blend-mode:soft-light}
  .card{position:relative;margin:auto;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  h1{margin:0;line-height:.92;font-style:italic;font-weight:900}
  h1 span{display:block;font-size:clamp(46px,13vw,88px);background:linear-gradient(90deg,#00E5FF,#8B5CF6,#FF2D95);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(0,229,255,.55))}
  h1 small{display:block;font-size:clamp(17px,5.4vw,30px);letter-spacing:.5em;text-shadow:0 0 14px #FF2D95;margin-top:6px;padding-left:.5em}
  [hidden]{display:none!important}
  .brand.full{max-width:min(88vw,540px);max-height:clamp(150px,48vw,250px);-webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 70%,transparent 100%);mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 70%,transparent 100%)}
  .brand{display:block;margin:0 auto;max-width:min(78vw,420px);max-height:clamp(64px,15vw,112px);width:auto;height:auto;filter:drop-shadow(0 0 14px rgba(255,255,255,.28))}
  h2{margin:0;font-size:clamp(26px,6.5vw,40px);font-style:italic;text-shadow:0 0 16px var(--ma)}
  .sub{margin:0;color:#a8bbd0;font-size:clamp(13px,3.6vw,16px);line-height:1.5}
  .big{font:900 clamp(20px,5vw,26px) 'Trebuchet MS',sans-serif;letter-spacing:.12em;color:#080B12;border:0;border-radius:999px;padding:15px 58px;min-height:58px;
    background:linear-gradient(90deg,#00E5FF,#8B5CF6,#FF2D95);box-shadow:0 0 30px rgba(139,92,246,.65),inset 0 2px 0 rgba(255,255,255,.4)}
  .big:active{transform:scale(.96)}
  .big:disabled{opacity:.6;cursor:wait}
  .ghost{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.05);border-radius:999px;padding:10px 22px;min-height:46px;font-weight:700}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .picker{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
  .arrow{width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(12,17,32,.7);font-size:22px;padding:0;flex:none}
  .arrow:active{background:rgba(0,229,255,.25)}
  .tcard{width:min(66vw,400px);padding:10px;border-radius:20px;border:1.5px solid var(--c);background:rgba(10,14,26,.8);
    box-shadow:0 0 34px var(--c),inset 0 1px 0 rgba(255,255,255,.12);display:flex;flex-direction:column;gap:7px;align-items:center}
  .tcard canvas{width:100%;aspect-ratio:1024/560;border-radius:12px;background:#0b1018}
  .tmeta{display:flex;flex-direction:column;gap:1px}
  .tmeta b{font-size:17px}.tmeta span{font-size:12.5px;color:#9fb4c8}
  #dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #dots i{width:8px;height:8px;border-radius:50%;background:#33425a}
  #dots i.on{background:var(--c);box-shadow:0 0 8px var(--c);transform:scale(1.25)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:clamp(11.5px,3.1vw,13px);color:#b6c5d8}
  .chips span{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px}
  kbd{background:#0f1c2c;border:1px solid rgba(0,229,255,.35);border-radius:5px;padding:0 6px;font:inherit}
  #status{margin:0;font-size:12px;color:#6c8097;min-height:1.2em}
  #back{font-size:13px;color:#00E5FF;text-decoration:none}
  .seg{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14)}
  .seg button{border:0;background:transparent;border-radius:999px;padding:10px 18px;font-weight:800;font-size:clamp(13px,3.6vw,16px);color:#b6c5d8;min-height:44px}
  .seg button.on{background:linear-gradient(90deg,#00E5FF,#8B5CF6);color:#06101a;box-shadow:0 0 16px rgba(0,229,255,.5)}
  #path{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:420px}
  #path i{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font:800 12px system-ui,sans-serif;font-style:normal;color:#9fb4c8}
  #path i.done{background:var(--c);border-color:var(--c);color:#06101a;box-shadow:0 0 10px var(--c)}
  #goalWrap{margin-top:6px}
  #goalTxt{font-size:10.5px;letter-spacing:.12em;color:#9fb4c8;font-weight:700}
  #goalBar{height:6px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:3px}
  #goalBar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--ma))}
  #msg{white-space:pre-line}
  .score-big{font:900 clamp(40px,10vw,64px)/1 'Trebuchet MS',sans-serif;background:linear-gradient(90deg,#fff,#00E5FF);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--c))}
</style>
</head>
<body class="menu">
<canvas id="gl"></canvas>

<div id="hud">
  <div id="hL" class="glass"><canvas id="sideLogo" width="256" height="256"></canvas><div class="lbl">SCORE</div><div id="score">0</div><div id="best">BEST 0</div><div id="tname"></div><div id="goalWrap" class="hidden"><div id="goalTxt"></div><div id="goalBar"><b id="goalFill"></b></div></div></div>
  <div id="hC" class="glass"><div class="lbl">KUGELN</div><div id="balls"></div><div id="mult"></div></div>
  <div id="hR"><div id="btns">
    <button class="ib glass" id="bPause" aria-label="Pause">⏸</button>
    <button class="ib glass" id="bSound" aria-label="Ton">🔊</button>
    <button class="ib glass" id="bRestart" aria-label="Neustart">↻</button>
  </div></div>
</div>
<div id="meter"><b id="meterB"></b></div>
<div id="msg"></div>
<div id="pops"></div>
<div id="hint"><kbd>←</kbd>/<kbd>A</kbd> links · <kbd>→</kbd>/<kbd>D</kbd> rechts · <kbd>Leertaste</kbd> halten &amp; loslassen = Start · <kbd>P</kbd> Pause · <kbd>R</kbd> Neustart · <kbd>M</kbd> Ton</div>
<div id="touch">
  <button id="tL">◀ LINKS</button>
  <button id="tLaunch">START<br>halten</button>
  <button id="tR">RECHTS ▶</button>
</div>

<div id="menu" class="ov">
  <div class="card">
    <h1><span id="brandText">AnMaCha</span><img id="brandImg" class="brand" alt="AnMaCha" hidden><small id="brandSub">PINBALL</small></h1>
    <div class="seg"><button id="mCamp" class="on">🏁 Kampagne</button><button id="mFree">🎯 Freies Spiel</button></div>
    <p class="sub" id="modeInfo"></p>
    <div id="campBox"><div id="path"></div></div>
    <div class="picker hidden" id="pickBox">
      <button class="arrow" id="tPrev" aria-label="Voriger Tisch">◀</button>
      <div class="tcard" id="tcard"><canvas id="tprev" width="512" height="280"></canvas>
        <div class="tmeta"><b id="tTitle"></b><span id="tSub"></span></div><div id="dots"></div></div>
      <button class="arrow" id="tNext" aria-label="Nächster Tisch">▶</button>
    </div>
    <button class="big" id="bPlay" disabled>LADE …</button>
    <div class="chips">
      <span>💻 <kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> Flipper</span>
      <span><kbd>Leertaste</kbd> halten &amp; loslassen = Start</span>
      <span><kbd>P</kbd> Pause · <kbd>R</kbd> Neustart · <kbd>M</kbd> Ton</span>
      <span>📱 LINKS / RECHTS / START halten</span>
    </div>
    <p id="status"></p>
    <a id="back" href="../">← Alle Spiele</a>
  </div>
</div>

<div id="pauseOv" class="ov hidden">
  <div class="card"><h2>PAUSE</h2>
    <button class="big" id="pResume">WEITER</button>
    <div class="row"><button class="ghost" id="pRestart">↻ Neustart</button><button class="ghost" id="pMenu">Tischwahl</button></div>
  </div>
</div>
<div id="overOv" class="ov hidden">
  <div class="card"><h2 id="oTitle">GAME OVER</h2>
    <div class="score-big" id="oScore">0</div>
    <p class="sub" id="oText"></p>
    <button class="big" id="oAgain">PLAY AGAIN</button>
    <button class="ghost" id="oMenu">Anderer Tisch</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined') {
  $('status').textContent = 'three.js konnte nicht geladen werden. Bitte Internetverbindung prüfen.';
  $('bPlay').textContent = 'OFFLINE';
  throw new Error('THREE missing');
}
const TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (TOUCH) document.body.classList.add('touch');
if (window.self !== window.top) $('back').style.display = 'none';

let brandTitle = null;       // komplettes Titel-Logo des Spiels (falls vorhanden), wird auch auf der Backbox gezeigt
// Haupt-Logo (optional): logo.png / .jpg / .jpeg / .svg / .webp im Spielordner, sonst im Hauptordner (../). Ersetzt das Wort „AnMaCha“ im Menü.
(function loadBrandLogo() {
  const exts = ['png', 'jpg', 'jpeg', 'svg', 'webp'], cands = [];
  ['', '../'].forEach(d => exts.forEach(e => cands.push(`${d}logo.${e}`)));
  Promise.all(cands.map(src => new Promise(res => { const im = new Image(); im.onload = () => res(src); im.onerror = () => res(null); im.src = src; })))
    .then(list => {
      const src = list.find(Boolean); if (!src) return;
      const img = $('brandImg'); img.src = src; img.hidden = false; $('brandText').hidden = true;
      if (!src.startsWith('../')) {                      // Logo aus dem Spielordner = kompletter Titel (inkl. Spielname)
        img.classList.add('full'); $('brandSub').hidden = true;
        img.addEventListener('load', () => { brandTitle = img; if (typeof refreshBrand === 'function') refreshBrand(); }, { once: true });
        if (img.complete && img.naturalWidth) { brandTitle = img; }
      }
    });
})();


/* ================= Konfiguration ================= */
// Logos: logos/01.png|jpg|jpeg ... 13 (jedes Logo = ein eigener Tisch; ohne Logos gibt es 3 Platzhalter-Tische)
const LOGO_DIR = 'logos/', LOGO_MAX = 13, TABLE_COUNT = 13, BALLS = 5;   // 13 Tische (Logo Nr. = Tisch Nr.)

// Logo-Bilder sofort im Hintergrund laden (Endungen parallel prüfen)
const rawLogos = [], t0 = performance.now();
let probesLeft = LOGO_MAX;
for (let i = 0; i < LOGO_MAX; i++) {
  const name = `${LOGO_DIR}${String(i + 1).padStart(2, '0')}`;
  Promise.all(['png', 'jpg', 'jpeg'].map(ext => new Promise(res => {
    const im = new Image();
    im.decoding = 'async'; im.onload = () => res(im); im.onerror = () => res(null); im.src = `${name}.${ext}`;
  }))).then(l => { const im = l.find(Boolean); if (im) rawLogos[i] = im; probesLeft--; });
}

/* ================= Physik-Konstanten (logische Einheiten, y nach unten) ================= */
const W = 620, H = 1000, S = 1 / 50;                 // Tischgröße, Welt-Skalierung
let G = 1500, VMAX = 2400, launchScale = 1;           // werden pro Tisch durch die Schwierigkeit gesetzt
const BALL_R = 13, DT = 1 / 480;
const A_REST = 0.52, A_ON = -0.5, FLIP_UP = 17, FLIP_DOWN = 10;
let FL_LEN = 100;
const LANE_X = 560, LANE_L = 535, DRAIN_Y = 1020;
const CX = 277.5;                                    // Spielfeld-Mitte (ohne Startbahn)
const mx = x => 2 * CX - x;
const seeded = sd => () => (sd = sd * 16807 % 2147483647) / 2147483647;   // kleiner Zufallsgenerator (gleiche Kunst bei jedem Start)                          // Spiegelung links/rechts

const PALETTE = [0x00E5FF, 0xFF2D95, 0x8B5CF6, 0x9DFF00, 0xFFB020, 0x3D8BFF, 0xFF4D4D, 0x00FFC8];
const BUMPER = {   // Punkte laut Spiel: ON AIR 100, HIT ZONE 250, BASS BOOST 500, Lautsprecher 50
  onair: { pts: 100, label: 'ON AIR', kick: 620 },
  hit:   { pts: 250, label: 'HIT ZONE', kick: 700 },
  bass:  { pts: 500, label: 'BASS\nBOOST', kick: 820 },
  spk:   { pts: 50, label: '', kick: 560 }
};
const LAYOUTS = [
  { name: 'Studio', bumpers: [['onair', 190, 330, 30], ['hit', 365, 330, 30], ['bass', CX, 450, 34], ['spk', 130, 520, 20], ['spk', 425, 520, 20]], rails: [] },
  { name: 'Mixer', bumpers: [['bass', CX, 255, 34], ['onair', 180, 400, 28], ['hit', 375, 400, 28], ['spk', CX, 525, 22], ['spk', 100, 330, 18], ['spk', 455, 330, 18]],
    rails: [[45, 560, 110, 604], [510, 560, 445, 604]] },
  { name: 'Antenne', bumpers: [['hit', CX, 235, 26], ['onair', CX, 350, 30], ['bass', CX, 480, 34], ['spk', 150, 420, 20], ['spk', 405, 420, 20], ['spk', 110, 560, 18], ['spk', 445, 560, 18]],
    rails: [[70, 250, 140, 200], [485, 250, 415, 200]] },
  { name: 'Equalizer', bumpers: [['onair', 200, 255, 28], ['hit', 355, 255, 28], ['bass', CX, 330, 30], ['spk', 120, 430, 18], ['spk', 200, 430, 18], ['spk', CX, 430, 18], ['spk', 355, 430, 18], ['spk', 435, 430, 18]],
    rails: [[60, 520, 120, 560], [495, 520, 435, 560]] },

const SLING_KICK = 430;

// Schwierigkeit pro Tisch (i = 0..12): stärkere Schwerkraft, kürzere Flipper, mehr Störsender, höheres Punkteziel

function logoCanvas(img, label, color) {
  const S2 = 384, c = document.createElement('canvas'); c.width = c.height = S2;
  const g = c.getContext('2d');
  g.fillStyle = '#eef5f1'; g.fillRect(0, 0, S2, S2);
  if (img) {
    const sc = Math.min((S2 - 48) / img.width, (S2 - 48) / img.height);
    g.drawImage(img, (S2 - img.width * sc) / 2, (S2 - img.height * sc) / 2, img.width * sc, img.height * sc);
    try { g.getImageData(0, 0, 1, 1); } catch (e) { return null; }       // file:// blockiert Bilder
  } else {
    g.fillStyle = '#' + color.toString(16).padStart(6, '0'); g.textAlign = 'center';
    g.font = 'bold 70px sans-serif'; g.fillText('LOGO', S2 / 2, 190);
    g.font = 'bold 90px sans-serif'; g.fillText(label, S2 / 2, 290);

}

}

/* ================= Physik ================= */
const ball = { x: LANE_X, y: 960, vx: 0, vy: 0 };
let walls = [], bumpers = [], slings = [], rolls = [], flippers = [], movers = [];
const held = [false, false];       // gedrückte Flipper-Tasten (bleiben beim Tischwechsel erhalten)

function buildPhysics(t) {
  walls = []; bumpers = []; slings = []; rolls = []; movers = [];
  const wall = (ax, ay, bx, by, rad = 3.5, e = 0.5) => walls.push({ ax, ay, bx, by, rad, e, vis: true });
  // Bogen oben
  const R = 282.5, cx = 302.5, cy = 292.5;
  let px = cx - R, py = cy;
  for (let i = 1; i <= 28; i++) {
    const a = Math.PI + (i / 28) * Math.PI, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    wall(px, py, x, y, 3.5, 0.45); px = x; py = y;
  }
  wall(20, cy, 20, 770);                    // links
  wall(585, cy, 585, 980);                  // rechts außen
  wall(LANE_L, 250, LANE_L, 980);           // Trennwand zur Startbahn
  wall(LANE_L, 980, 585, 980);              // Boden der Startbahn
  wall(20, 770, 150, 872, 3.5, 0.4);        // Führung links
  wall(LANE_L, 770, 405, 872, 3.5, 0.4);    // Führung rechts
  // Schleudern (Slingshots): Kickfläche + feste Kanten
  [[62, 640, 122, 730, 62, 730], [mx(62), 640, mx(122), 730, mx(62), 730]].forEach(([ax, ay, bx, by, cx2, cy2]) => {
    slings.push({ ax, ay, bx, by, cx: cx2, cy: cy2, nx: 0, ny: 0, flash: 0 });
    walls.push({ ax: ax, ay: ay, bx: cx2, by: cy2, rad: 3.5, e: 0.5, vis: false });
    walls.push({ ax: cx2, ay: cy2, bx: bx, by: by, rad: 3.5, e: 0.5, vis: false });
  });
  // Normalen der Schleudern sauber berechnen (zeigen ins Spielfeld)
  slings.forEach(s => {
    let nx = -(s.by - s.ay), ny = s.bx - s.ax; const l = Math.hypot(nx, ny); nx /= l; ny /= l;
    const mxp = (s.ax + s.bx) / 2, myp = (s.ay + s.by) / 2;
    if ((CX - mxp) * nx + (500 - myp) * ny < 0) { nx = -nx; ny = -ny; }   // Richtung Spielfeld-Mitte
    s.nx = nx; s.ny = ny;
  });
  const mir = t.idx >= 5, swap = { onair: 'hit', hit: 'onair' };      // ab Tisch 6: gespiegeltes Layout mit vertauschten Rollen
  t.layout.rails.forEach(r => mir ? wall(mx(r[0]), r[1], mx(r[2]), r[3], 3.5, 0.5) : wall(r[0], r[1], r[2], r[3], 3.5, 0.5));
  t.layout.bumpers.forEach(([type, x, y, r]) => bumpers.push({ type: mir ? (swap[type] || type) : type, x: mir ? mx(x) : x, y, r, flash: 0, cd: 0 }));
  for (let j = 0; j < t.diff.jam; j++) movers.push({ x: CX, y: 600, r: 15, amp: 95 + j * 18, w: 1.1 + j * 0.45, ph: j * 2.1, vx: 0, tm: 0, flash: 0, cd: 0 });   // Störsender pendeln vor den Flippern
  ROLLOVERS.forEach(([x, y]) => rolls.push({ x, y, r: 18, lit: false }));
  flippers = [
    { px: 160, py: 880, side: 1, a: held[0] ? A_ON : A_REST, w: 0, on: held[0], rp: 13, rt: 7 },
    { px: mx(160), py: 880, side: -1, a: held[1] ? A_ON : A_REST, w: 0, on: held[1], rp: 13, rt: 7 }
  ];
}

function closest(ax, ay, bx, by, x, y) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l2)) : 0;
  return [ax + dx * t, ay + dy * t, t];
}
// Kreis (Kugel) gegen Punkt mit Radius: schiebt die Kugel raus, reflektiert; surfaceVel = Geschwindigkeit der Fläche
function bounce(cx, cy, rad, e, kick, svx = 0, svy = 0) {
  let nx = ball.x - cx, ny = ball.y - cy, d = Math.hypot(nx, ny);
  const min = BALL_R + rad;
  if (d >= min) return null;
  if (d < 1e-6) { nx = 0; ny = -1; d = 1; } else { nx /= d; ny /= d; }
  ball.x = cx + nx * min; ball.y = cy + ny * min;
  const vn = (ball.vx - svx) * nx + (ball.vy - svy) * ny;
  if (vn < 0) {
    const imp = -(1 + e) * vn;
    ball.vx += imp * nx; ball.vy += imp * ny;
  }
  if (kick) {
    const v2 = (ball.vx - svx) * nx + (ball.vy - svy) * ny;
    if (v2 < kick) { ball.vx += (kick - v2) * nx; ball.vy += (kick - v2) * ny; }
  }
  return [nx, ny, -vn];
}

const events = [];
let touchedFlip = false, idleT = 0;   // idleT: Sekunden seit dem letzten Flipper-Kontakt            // Ereignisse der Physik (Treffer etc.), werden pro Frame ausgewertet

function stepPhysics(dt) {
  // Flipper bewegen (Winkelgeschwindigkeit merken, damit die Kugel Schwung bekommt)
  for (const f of flippers) {
    const tgt = f.on ? A_ON : A_REST, sp = f.on ? FLIP_UP : FLIP_DOWN;
    let da = tgt - f.a; const m = sp * dt;
    if (Math.abs(da) > m) da = Math.sign(da) * m;
    f.w = da / dt; f.a += da;
  }
  ball.vy += G * dt;
  ball.vx *= 1 - 0.02 * dt; ball.vy *= 1 - 0.02 * dt;
  const sp = Math.hypot(ball.vx, ball.vy);
  if (sp > VMAX) { ball.vx *= VMAX / sp; ball.vy *= VMAX / sp; }
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;

  for (const w of walls) {
    const [cx, cy] = closest(w.ax, w.ay, w.bx, w.by, ball.x, ball.y);
    const r = bounce(cx, cy, w.rad, w.e, 0);
    if (r && r[2] > 250) events.push({ k: 'wall', v: r[2] });
  }
  // Einweg-Tor: die Kugel darf aus der Startbahn nach links ins Spielfeld, aber nicht zurück
  if (ball.vx > 0 && ball.y > GATE.y0 && ball.y < GATE.y1 && ball.x < GATE.x && ball.x + BALL_R > GATE.x) {
    ball.x = GATE.x - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.35; events.push({ k: 'wall', v: 300 });
  }
  for (const s of slings) {
    const [cx, cy] = closest(s.ax, s.ay, s.bx, s.by, ball.x, ball.y);
    const r = bounce(cx, cy, 5, 0.5, 0);
    if (r && r[2] > 120) {                               // nur bei echtem Aufprall kicken
      const v2 = ball.vx * s.nx + ball.vy * s.ny;
      if (v2 < SLING_KICK) { ball.vx += (SLING_KICK - v2) * s.nx; ball.vy += (SLING_KICK - v2) * s.ny; }   // schwache Kugeln bekommen Schwung, schnelle werden eher gebremst
      events.push({ k: 'sling', o: s });
    }
  }
  for (const b of bumpers) {
    if (b.cd > 0) b.cd -= dt;
    const r = bounce(b.x, b.y, b.r, 1, BUMPER[b.type].kick);
    if (r && b.cd <= 0) { b.cd = 0.08; events.push({ k: 'bumper', o: b }); }
  }
  for (const m of movers) {
    m.tm += dt; m.x = CX + m.amp * Math.sin(m.w * m.tm + m.ph); m.vx = m.amp * m.w * Math.cos(m.w * m.tm + m.ph);
    if (m.cd > 0) m.cd -= dt;
    const r = bounce(m.x, m.y, m.r, 1, 430, m.vx, 0);
    if (r && m.cd <= 0) { m.cd = 0.1; events.push({ k: 'mover', o: m }); }
  }
  for (const f of flippers) {
    const dx = f.side * Math.cos(f.a), dy = Math.sin(f.a);
    const tx = (ball.x - f.px) * dx + (ball.y - f.py) * dy, t = Math.max(0, Math.min(1, tx / FL_LEN));
    const cx = f.px + dx * FL_LEN * t, cy = f.py + dy * FL_LEN * t, fr = f.rp + (f.rt - f.rp) * t;
    const sx = cx - f.px, sy = cy - f.py;
    const r = bounce(cx, cy, fr, 0.35, 0, -f.side * f.w * sy, f.side * f.w * sx);   // Flächengeschwindigkeit v = side*w*(-sy, sx)
    if (r) { touchedFlip = true; if (Math.abs(f.w) > 1) events.push({ k: 'flip' }); }
  }
  const sp2 = Math.hypot(ball.vx, ball.vy);
  if (sp2 > VMAX) { ball.vx *= VMAX / sp2; ball.vy *= VMAX / sp2; }     // auch nach Stößen begrenzen
  for (const r of rolls) if (!r.lit && Math.hypot(ball.x - r.x, ball.y - r.y) < r.r) { r.lit = true; events.push({ k: 'roll', o: r }); }
}

/* ================= Spielzustand ================= */
let state = 'menu';          // menu | ready | play | drain | paused | over
let prevState = 'play';
let mode = 'campaign', tableScore = 0, pendingLoad = null, loadedIdx = -1, progress = 0;
let score = 0, best = 0, balls = BALLS, combo = 0, comboT = 0, zoneT = 0, waitT = 0, power = 0, charging = false, stuckT = 0, flipPlayed = [false, false];
try { best = +localStorage.getItem('anmachaFlipperBest') || 0; progress = +localStorage.getItem('anmachaPinballProgress') || 0;
  mode = localStorage.getItem('anmachaPinballMode') === 'free' ? 'free' : 'campaign'; } catch (e) {}
const curMult = () => Math.min(8, 1 + Math.floor(combo / 4) + (zoneT > 0 ? 1 : 0));

function setBallsUI() {
  const el = $('balls');
  const cap = Math.max(BALLS, balls);                  // Bonus-Kugeln werden zusätzlich angezeigt
  if (el.children.length !== cap) { el.textContent = ''; for (let i = 0; i < cap; i++) el.appendChild(document.createElement('i')); }
  [...el.children].forEach((c, i) => c.classList.toggle('off', i >= balls));
}
function message(t, color = '#FF2D95') {
  const m = $('msg'); m.textContent = t; m.style.textShadow = `0 0 18px ${color}`;
  m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}
function resetBall() {
  ball.x = LANE_X; ball.y = 960; ball.vx = 0; ball.vy = 0;
  power = 0; charging = false; stuckT = 0; idleT = 0;
  state = 'ready';
}
function newGame() {
  if (mode === 'campaign') tableIdx = 0;                       // Kampagne startet immer bei Tisch 1
  if (loadedIdx !== tableIdx) loadTable(tableIdx);
  score = 0; tableScore = 0; balls = BALLS; combo = 0; comboT = 0; zoneT = 0; pendingLoad = null;
  rolls.forEach(r => r.lit = false);
  flippers.forEach(f => { f.on = false; f.a = A_REST; f.w = 0; });
  setBallsUI(); resetBall();
  $('menu').classList.add('hidden'); $('pauseOv').classList.add('hidden'); $('overOv').classList.add('hidden');
  document.body.classList.remove('menu');
  message(mode === 'campaign' ? `TISCH 1 · Ziel ${T.diff.goal}` : 'PLAY!', '#00E5FF');
}
function loseBall() {
  balls--; combo = 0; comboT = 0; zoneT = 0; setBallsUI(); SFX.lost();
  if (balls <= 0) { gameOver(); return; }
  message(balls === 1 ? 'LETZTE KUGEL!' : `KUGEL VERLOREN · noch ${balls}`);
  state = 'drain'; waitT = 1.0;
}
function gameOver(win) {
  state = 'over'; win ? SFX.bonus() : SFX.over();
  const fin = Math.floor(score), nb = fin > best;
  if (nb) { best = fin; try { localStorage.setItem('anmachaFlipperBest', best); } catch (e) {} }
  $('oTitle').textContent = win ? `ALLE ${TABLE_COUNT} TISCHE GESCHAFFT! 🏆` : 'GAME OVER';
  $('oScore').textContent = fin;
  const where = mode === 'campaign' && !win ? `Erreicht: Tisch ${tableIdx + 1} von ${TABLE_COUNT} · ` : '';
  $('oText').innerHTML = `${where}Best: <b>${best}</b>${nb ? ' · 🏆 Neuer Bestwert!' : ''}`;
  $('overOv').classList.remove('hidden');
}
function gain(pts) {                                            // Punkte für Gesamtscore und Tisch-Ziel
  score += pts; tableScore += pts;
  if (mode === 'campaign' && state === 'play' && tableScore >= T.diff.goal) clearTable();
}
function clearTable() {
  const n = tableIdx;
  progress = Math.max(progress, n + 1); try { localStorage.setItem('anmachaPinballProgress', progress); } catch (e) {}
  SFX.bonus(); burst(CX, 400, 0x00E5FF, 40); burst(CX, 300, 0xFF2D95, 30);
  if (n >= TABLE_COUNT - 1) { gameOver(true); return; }
  let txt = `TISCH ${n + 1} GESCHAFFT!`;
  if ((n + 1) % 3 === 0) { balls++; setBallsUI(); txt += '\n+1 KUGEL'; }
  message(txt, '#00E5FF');
  state = 'drain'; waitT = 2.2; pendingLoad = n + 1; combo = 0; comboT = 0; zoneT = 0;
}
function pauseGame() { if (state === 'play' || state === 'ready' || state === 'drain') { prevState = state; state = 'paused'; $('pauseOv').classList.remove('hidden'); } }
function resumeGame() { if (state === 'paused') { state = prevState; $('pauseOv').classList.add('hidden'); } }
function toMenu() {
  state = 'menu'; ['pauseOv', 'overOv'].forEach(i => $(i).classList.add('hidden')); $('menu').classList.remove('hidden');
  document.body.classList.add('menu'); flippers.forEach((f, i) => setFlip(i, false)); charging = false;
  loadTable(tableIdx); drawPreview(); setMode(mode);
}
function restartGame() { if (state !== 'menu') newGame(); }

function addScore(base, x, y, color, label) {
  comboT = 3; combo++;
  const prev = curMult(), pts = base * prev;
  gain(pts);
  popup(`+${pts}`, x, y, color);
  if (combo % 4 === 0) { SFX.combo(); message(`COMBO x${curMult()}`, '#00E5FF'); }
}

function handleEvents() {
  for (const e of events) {
    if (e.k === 'bumper') {
      const b = e.o, def = BUMPER[b.type];
      b.flash = 1;
      if (b.type === 'hit') { zoneT = 12; }
      addScore(def.pts, b.x, b.y, '#' + T.color.toString(16).padStart(6, '0'));
      SFX[b.type === 'spk' ? 'spk' : b.type](); burst(b.x, b.y, b.type === 'bass' ? 0xFF2D95 : T.color, b.type === 'bass' ? 22 : 12);
      shake = Math.max(shake, b.type === 'bass' ? 0.12 : 0.05);
    } else if (e.k === 'sling') {
      e.o.flash = 1; addScore(20, ball.x, ball.y, '#8B5CF6'); SFX.sling(); burst(ball.x, ball.y, 0x8B5CF6, 6);
    } else if (e.k === 'roll') {
      gain(100 * curMult()); popup(`+${100 * curMult()}`, e.o.x, e.o.y, '#00FFC8'); SFX.spk();
      if (rolls.every(r => r.lit)) {
        gain(1000); SFX.bonus(); message('ON AIR BONUS +1000', '#FF2D95'); burst(CX, 140, 0xFF2D95, 30);
        popup('+1000', CX, 160, '#FF2D95'); setTimeout(() => rolls.forEach(r => r.lit = false), 700);
      }
    } else if (e.k === 'mover') {
      e.o.flash = 1; addScore(50, e.o.x, e.o.y, '#FF2D95'); SFX.sling(); burst(e.o.x, e.o.y, 0xFF2D95, 8);
    } else if (e.k === 'flip') { /* Flipper-Treffer: kein Extra-Ton */ }
    else if (e.k === 'wall' && e.v > 500) SFX.wall();
  }
  events.length = 0;
}

function simulate(dt) {
  if (state === 'ready' && charging) { power = Math.min(1, power + dt / 1.0); }
  if (state === 'drain') {
    waitT -= dt;
    if (waitT <= 0) {
      if (pendingLoad !== null) { const i = pendingLoad; pendingLoad = null; loadTable(i); tableScore = 0; message(`TISCH ${i + 1} · Ziel ${T.diff.goal}`, hex(T.color)); }
      resetBall();
    }
    return;
  }
  if (state !== 'play' && state !== 'ready') return;
  if (comboT > 0 && (comboT -= dt) <= 0) combo = 0;
  if (zoneT > 0) zoneT -= dt;
  const n = Math.max(1, Math.ceil(dt / DT));
  for (let i = 0; i < n; i++) stepPhysics(dt / n);
  handleEvents();
  // Sicherung gegen Endlosschleifen (z. B. Kugel pendelt ewig zwischen Schleudern): nach langer Zeit ohne Flipper-Kontakt langsam abbremsen
  if (touchedFlip) { idleT = 0; touchedFlip = false; } else idleT += dt;
  if (idleT > 20) { const k = Math.max(0, 1 - Math.min(1, (idleT - 20) / 20) * 0.35 * dt); ball.vx *= k; ball.vy *= k; }
  const sp = Math.hypot(ball.vx, ball.vy), inLane = ball.x > LANE_L && ball.y > 930;
  if (state === 'play') {
    if (inLane && sp < 40) { state = 'ready'; power = 0; }

  [-3.4, 3.4].forEach((x, k) => { const btn = new THREE.Mesh(cached('btn', () => { const q = new THREE.CylinderGeometry(0.36, 0.4, 0.08, 20); q.userData.shared = true; return q; }), new THREE.MeshBasicMaterial({ color: k ? col2 : col })); btn.position.set(x, 0.58, HH + 0.7); tableGroup.add(btn); });

  // Rim-Lichter in den Tischfarben
  const l1 = new THREE.PointLight(col, 0.55, 26), l2 = new THREE.PointLight(col2, 0.45, 26);
  l1.position.set(-6, 7, -4); l2.position.set(6, 7, 3); tableGroup.add(l1, l2);

  // Spielfläche (glänzend)
  const ptex = playfieldTexture(T);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W * S, H * S).rotateX(-Math.PI / 2),
    new THREE.MeshPhongMaterial({ map: ptex, emissive: 0xffffff, emissiveMap: ptex, emissiveIntensity: 0.42, specular: 0x253552, shininess: 38 }));
  tableGroup.add(floor);
  const base = new THREE.Mesh(boxGeo(), new THREE.MeshLambertMaterial({ color: dark }));
  base.scale.set(W * S + 0.6, 0.4, H * S + 0.6); base.position.y = -0.22; tableGroup.add(base);

  // Wände mit Neon-Schein
  walls.filter(w => w.vis).forEach(w => {
    tableGroup.add(wallMesh(w.ax, w.ay, w.bx, w.by, w.rad, 0.6, col, 0.9));
    const len = Math.hypot(w.bx - w.ax, w.by - w.ay) * S + 0.3;
    glowPlane(len, 0.95, wx((w.ax + w.bx) / 2), 0.03, wz((w.ay + w.by) / 2), col, 0.2, -Math.atan2(w.by - w.ay, w.bx - w.ax));
  });
  const gate = wallMesh(GATE.x, GATE.y0, GATE.x, GATE.y1, 1.5, 0.35, 0xFF2D95, 0.9); gate.material.transparent = true; gate.material.opacity = 0.55;
  tableGroup.add(gate);

  // Schleudern
  slings.forEach(s => {
    const shape = new THREE.Shape([new THREE.Vector2(wx(s.ax), wz(s.ay)), new THREE.Vector2(wx(s.bx), wz(s.by)), new THREE.Vector2(wx(s.cx), wz(s.cy))]);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.45, bevelEnabled: false }).rotateX(Math.PI / 2);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0x241447, emissive: 0x8B5CF6, emissiveIntensity: 0.35, metalness: 0.4, roughness: 0.4, envMap: env }));
    mesh.position.y = 0.45;
    const face = wallMesh(s.ax, s.ay, s.bx, s.by, 5, 0.5, 0xb28cff, 1); face.position.y = 0.28;
    tableGroup.add(mesh, face); slingMeshes.push({ face, mesh });
  });

  // Bumper (Pilz-Form mit Schein)
  bumpers.forEach(b => {
    const g = new THREE.Group(), rr = b.r * S, c = b.type === 'bass' ? 0xFF2D95 : b.type === 'onair' ? 0xFF4D4D : b.type === 'hit' ? col2 : col;
    const skirt = new THREE.Mesh(cached(`sk${rr}`, () => { const x = new THREE.CylinderGeometry(rr * 0.95, rr * 1.18, 0.26, 28); x.userData.shared = true; return x; }),
      new THREE.MeshStandardMaterial({ color: 0x20283f, metalness: 0.7, roughness: 0.3, envMap: env, emissive: c, emissiveIntensity: 0.18 }));
    skirt.position.y = 0.13;
    const body = new THREE.Mesh(cached(`cyl${rr}`, () => { const x = new THREE.CylinderGeometry(rr * 0.9, rr * 0.95, 0.42, 28); x.userData.shared = true; return x; }),
      new THREE.MeshStandardMaterial({ color: 0x1b2238, metalness: 0.5, roughness: 0.35, envMap: env, emissive: c, emissiveIntensity: 0.4 }));
    body.position.y = 0.47;
    const cap = new THREE.Mesh(cached(`cap${rr}`, () => { const x = new THREE.CircleGeometry(rr * 0.84, 28).rotateX(-Math.PI / 2); x.userData.shared = true; return x; }),
      new THREE.MeshBasicMaterial({ map: bumperLabelTexture(b.type, c) }));
    cap.position.y = 0.69;
    const ring = new THREE.Mesh(cached(`tor${rr}`, () => { const x = new THREE.TorusGeometry(rr * 0.92, 0.055, 8, 32).rotateX(Math.PI / 2); x.userData.shared = true; return x; }),
      new THREE.MeshBasicMaterial({ color: c }));
    ring.position.y = 0.7;
    g.add(skirt, body, cap, ring); g.position.set(wx(b.x), 0, wz(b.y)); tableGroup.add(g);
    const halo = glowPlane(rr * 4.6, rr * 4.6, wx(b.x), 0.06, wz(b.y), c, 0.3);
    bumperMeshes.push({ g, body, ring, halo, c });
  });

  // Störsender (pendelnde Kugeln mit Antenne)
  movers.forEach(m => {
    const g = new THREE.Group(), rr = m.r * S;
    const orb = new THREE.Mesh(cached('orb', () => { const q = new THREE.SphereGeometry(1, 20, 14); q.userData.shared = true; return q; }), new THREE.MeshStandardMaterial({ color: 0x2a1030, emissive: 0xFF2D95, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.3, envMap: env }));
    orb.scale.setScalar(rr * 1.05); orb.position.y = rr * 1.05;
    const ant = new THREE.Mesh(boxGeo(), new THREE.MeshBasicMaterial({ color: 0xFF2D95 })); ant.scale.set(0.05, 0.7, 0.05); ant.position.y = rr * 2.1 + 0.3;
    const ring = new THREE.Mesh(cached('jring', () => { const q = new THREE.TorusGeometry(1, 0.06, 8, 28).rotateX(Math.PI / 2); q.userData.shared = true; return q; }), new THREE.MeshBasicMaterial({ color: 0xFF2D95 }));
    ring.scale.setScalar(rr * 1.3); ring.position.y = rr * 1.05;
    g.add(orb, ant, ring); g.position.set(wx(m.x), 0, wz(m.y)); tableGroup.add(g);
    const halo = glowPlane(rr * 6, rr * 6, wx(m.x), 0.07, wz(m.y), 0xFF2D95, 0.35);
    moverMeshes.push({ g, orb, halo, ring });
  });

  // Rollover-Lichter
  rolls.forEach(r => {
    const m = new THREE.Mesh(cached('roll', () => { const x = new THREE.CircleGeometry(0.34, 20).rotateX(-Math.PI / 2); x.userData.shared = true; return x; }),
      new THREE.MeshBasicMaterial({ color: col2, transparent: true, opacity: 0.25 }));
    m.position.set(wx(r.x), 0.04, wz(r.y)); tableGroup.add(m); rollMeshes.push(m);
  });

  // Frequenz-Dial Nadel
  needle = new THREE.Mesh(boxGeo(), new THREE.MeshBasicMaterial({ color: 0xFF2D95 }));
  needle.scale.set(0.9, 0.05, 0.05);
  const nb = new THREE.Group(); nb.add(needle); needle.position.x = 0.45; nb.position.set(wx(CX), 0.07, wz(600)); tableGroup.add(nb); needle = nb;

  // Flipper (glänzend, abgeschrägt)
  flippers.forEach(f => {
    const L = FL_LEN * S, r1 = f.rp * S, r2 = f.rt * S, ac = f.side > 0 ? col : col2;
    const sh = new THREE.Shape();
    sh.moveTo(0, r1); sh.lineTo(L, r2); sh.absarc(L, 0, r2, Math.PI / 2, -Math.PI / 2, true); sh.lineTo(0, -r1); sh.absarc(0, 0, r1, -Math.PI / 2, Math.PI / 2, true);
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.42, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.06, bevelSegments: 3 }).rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xf2f7ff, metalness: 0.85, roughness: 0.2, envMap: env, emissive: ac, emissiveIntensity: 0.28 }));
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: ac })));
    const g = new THREE.Group(); g.add(mesh); g.position.set(wx(f.px), 0.06, wz(f.py)); tableGroup.add(g); flipMeshes.push(g);
    const pin = new THREE.Mesh(cached('pin', () => { const q = new THREE.CylinderGeometry(0.2, 0.2, 0.12, 16); q.userData.shared = true; return q; }), new THREE.MeshBasicMaterial({ color: ac }));
    pin.position.y = 0.58; g.add(pin);
  });

  // Plunger
  plunger = new THREE.Mesh(boxGeo(), new THREE.MeshStandardMaterial({ color: 0xc8d2e4, metalness: 0.9, roughness: 0.25, envMap: env, emissive: col2, emissiveIntensity: 0.3 }));
  plunger.scale.set(0.5, 0.3, 0.5); plunger.position.set(wx(LANE_X), 0.15, wz(985)); tableGroup.add(plunger);

  // Backbox mit großem Logo-Display + Equalizer
  const bb = new THREE.Mesh(boxGeo(), new THREE.MeshStandardMaterial({ color: 0x131a2d, metalness: 0.6, roughness: 0.4, envMap: env }));
  bb.scale.set(W * S + 2.5, 7.3, 0.9); bb.position.set(0, 3.5, -HH - 0.55); tableGroup.add(bb);
  const bbE = new THREE.LineSegments(edgeGeo(), new THREE.LineBasicMaterial({ color: col })); bbE.scale.copy(bb.scale); bbE.position.copy(bb.position); tableGroup.add(bbE);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(W * S + 0.2, (W * S + 0.2) * 560 / 1024), new THREE.MeshBasicMaterial({ map: backglassTexture(T) }));
  glass.position.set(0, 0.45 + ((W * S + 0.2) * 560 / 1024) / 2, -HH - 0.04); tableGroup.add(glass);
  glowPlane(W * S + 3, 3, 0, 0.02, -HH - 0.6, col, 0.5);
  for (let i = 0; i < 26; i++) {
    const b = new THREE.Mesh(boxGeo(), new THREE.MeshBasicMaterial({ color: i % 3 ? col : col2 }));
    b.scale.set(0.2, 1, 0.1); b.position.set(-5.9 + i * 0.472, 0.1, -HH - 0.05); tableGroup.add(b); eqBars.push(b);
  }

  // Kugel: Chrom
  ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R * S, 28, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.08, envMap: env, envMapIntensity: 1.3 }));
  shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(BALL_R * S * 1.25, 16).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 }));
  tableGroup.add(ballMesh, shadowMesh);
  ballLight.color.setHex(col);
  $('tname').textContent = T.name;
  const sl = $('sideLogo').getContext('2d'); sl.fillStyle = '#0b1018'; sl.fillRect(0, 0, 256, 256); if (T.logo) sl.drawImage(T.logo, 0, 0, 256, 256);
  fitCamera();
}

const camBase = new THREE.Vector3(), camTarget = new THREE.Vector3(0, 1.0, 0.2);
function fitCamera() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = camera.aspect < 0.8 ? 46 : 36; camera.updateProjectionMatrix();
  const elev = 57 * Math.PI / 180, dir = new THREE.Vector3(0, Math.sin(elev), Math.cos(elev));
  const hx = W * S / 2 + 1.4, hz = H * S / 2 + 1.2, pts = [];
  [[-hx, 0, -hz], [hx, 0, -hz], [-hx, 0, hz], [hx, 0, hz], [-hx + 0.3, 7.6, -hz], [hx - 0.3, 7.6, -hz]].forEach(p => pts.push(new THREE.Vector3(...p)));
  const landscapeTouch = TOUCH && w > h && h < 600;
  const topPad = 0.9, botPad = TOUCH && !landscapeTouch ? 0.8 : 0.96;      // Platz für Anzeige / Touch-Tasten (quer: Tasten stehen seitlich)
  let d = 14;
  for (; d < 100; d += 0.4) {
    camBase.copy(camTarget).addScaledVector(dir, d); camera.position.copy(camBase); camera.lookAt(camTarget); camera.updateMatrixWorld(true);
    let ok = true;
    for (const p of pts) { const q = p.clone().project(camera); if (Math.abs(q.x) > 0.96 || q.y > topPad || q.y < -botPad) { ok = false; break; } }
    if (ok) break;
  }
}
addEventListener('resize', () => { if (tables.length) fitCamera(); });

/* ----- Effekte ----- */
const PN = 160, pPos = new Float32Array(PN * 3), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN), pCol = new Float32Array(PN * 3);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
for (let i = 0; i < PN; i++) pPos[i * 3 + 1] = -50;
const pPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.16, vertexColors: true, transparent: true, opacity: 0.95, depthWrite: false, blending: THREE.AdditiveBlending }));
pPoints.frustumCulled = false; scene.add(pPoints);
let pNext = 0;
function burst(lx, ly, color, n) {
  const c = new THREE.Color(color);
  for (let k = 0; k < n; k++) {
    const i = pNext = (pNext + 1) % PN, a = Math.random() * 6.283, s = 2 + Math.random() * 4;
    pPos[i * 3] = wx(lx); pPos[i * 3 + 1] = 0.6; pPos[i * 3 + 2] = wz(ly);
    pVel[i * 3] = Math.cos(a) * s; pVel[i * 3 + 1] = 1.5 + Math.random() * 3; pVel[i * 3 + 2] = Math.sin(a) * s;
    pLife[i] = 0.6 + Math.random() * 0.4; pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
  }
}
function updateParticles(dt) {
  for (let i = 0; i < PN; i++) {
    if (pLife[i] <= 0) { pPos[i * 3 + 1] = -50; continue; }
    pLife[i] -= dt; pVel[i * 3 + 1] -= 9 * dt;
    pPos[i * 3] += pVel[i * 3] * dt; pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt; pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0.05) { pPos[i * 3 + 1] = 0.05; pVel[i * 3 + 1] *= -0.3; }
  }
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
}
const _v = new THREE.Vector3();
function popup(text, lx, ly, color) {
  const pops = $('pops'); if (pops.children.length > 14) return;
  _v.set(wx(lx), 0.8, wz(ly)).project(camera);
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = text; el.style.setProperty('--c', color);
  el.style.left = ((_v.x + 1) / 2 * innerWidth) + 'px'; el.style.top = ((1 - _v.y) / 2 * innerHeight) + 'px';
  el.addEventListener('animationend', () => el.remove()); pops.appendChild(el);
}

function drawPreview() {
  if (!T) return;
  const c = $('tprev'), g = c.getContext('2d');
  g.drawImage(backglassCanvas(T), 0, 0, 512, 280);
  $('tTitle').textContent = T.name;
  $('tSub').textContent = '★'.repeat(T.diff.stars) + '☆'.repeat(5 - T.diff.stars) + ' · ' + (T.hasLogo ? 'Eigenes Logo' : `Platzhalter · logos/${String(T.idx + 1).padStart(2, '0')}.jpg`);
  const dots = $('dots'); if (dots.children.length !== tables.length) { dots.textContent = ''; tables.forEach(() => dots.appendChild(document.createElement('i'))); }
  [...dots.children].forEach((d, i) => d.classList.toggle('on', i === tableIdx));
}
function refreshBrand() {                    // Titel-Logo ist geladen: Backbox-Grafiken neu zeichnen (nur im Menü, damit kein laufendes Spiel gestört wird)
  tables.forEach(t => { t.bg = null; });
  if (state === 'menu' && tables.length && tablesBuilt) { loadTable(tableIdx); drawPreview(); }
}
function setMode(m) {
  mode = m; try { localStorage.setItem('anmachaPinballMode', m); } catch (e) {}
  $('mCamp').classList.toggle('on', m === 'campaign'); $('mFree').classList.toggle('on', m === 'free');
  $('campBox').classList.toggle('hidden', m !== 'campaign'); $('pickBox').classList.toggle('hidden', m !== 'free');
  $('modeInfo').innerHTML = m === 'campaign'
    ? `Tisch 1 bis ${TABLE_COUNT}: Erreiche auf jedem Tisch das Punkteziel, dann geht es zum nächsten – jeder Tisch ist schwerer. Alle 3 Tische gibt es eine Extra-Kugel.`
    : 'Such dir einen beliebigen Tisch aus – jeder hat sein eigenes Logo, Layout und eine eigene Schwierigkeit. 5 Kugeln, so viele Punkte wie möglich!';
  const path = $('path'); path.textContent = '';
  for (let i = 0; i < TABLE_COUNT; i++) { const d = document.createElement('i'); d.textContent = i + 1; d.classList.toggle('done', i < progress); path.appendChild(d); }
  if (m === 'free' && tables.length) drawPreview();
}
$('mCamp').addEventListener('click', () => setMode('campaign'));
$('mFree').addEventListener('click', () => setMode('free'));
function selectTable(i) {
  if (!tables.length) return;
  tableIdx = (i + tables.length) % tables.length;
  loadTable(tableIdx); drawPreview();
}

/* ================= Hauptschleife ================= */
let last = performance.now(), time = 0, ready = false, tablesBuilt = false;
function animate(dt) {
  time += dt;
  // Kugel
  ballMesh.position.set(wx(ball.x), BALL_R * S, wz(ball.y));
  shadowMesh.position.set(wx(ball.x) + 0.05, 0.02, wz(ball.y) + 0.05);
  ballLight.position.set(wx(ball.x), 1.7, wz(ball.y));
  ballMesh.rotation.z -= ball.vx * S * dt / (BALL_R * S); ballMesh.rotation.x += ball.vy * S * dt / (BALL_R * S);
  camera.position.set(camBase.x + (ball.x - CX) * 0.004, camBase.y, camBase.z); camera.lookAt(camTarget);
  // Flipper
  flippers.forEach((f, i) => { flipMeshes[i].rotation.y = f.side > 0 ? -f.a : -(Math.PI - f.a); });
  // Bumper / Schleudern / Rollover
  bumperMeshes.forEach((m, i) => {
    const b = bumpers[i]; b.flash = Math.max(0, b.flash - dt * 4);
    const s = 1 + b.flash * 0.18; m.g.scale.set(s, 1 + b.flash * 0.25, s);
    m.body.material.emissiveIntensity = 0.4 + b.flash * 1.6; m.halo.material.opacity = 0.3 + b.flash * 0.6;
  });
  moverMeshes.forEach((m, i) => {
    const mv = movers[i]; mv.flash = Math.max(0, mv.flash - dt * 4);
    m.g.position.x = wx(mv.x); m.halo.position.x = wx(mv.x); m.ring.rotation.y += dt * 4;
    m.orb.material.emissiveIntensity = 0.6 + mv.flash * 1.4; m.halo.material.opacity = 0.35 + mv.flash * 0.5;
  });
  slingMeshes.forEach((m, i) => { const s = slings[i]; s.flash = Math.max(0, s.flash - dt * 5); m.face.material.emissiveIntensity = 1 + s.flash * 2; });
  rollMeshes.forEach((m, i) => { m.material.opacity = rolls[i].lit ? 1 : 0.25 + 0.15 * Math.sin(time * 4 + i); });
  // Dial-Nadel: folgt Multiplikator + Geschwindigkeit
  const target = -2.5 + (curMult() - 1) * 0.45 + Math.min(1, Math.hypot(ball.vx, ball.vy) / 2000) * 0.8;
  needle.rotation.y += (-target - needle.rotation.y) * Math.min(1, dt * 6) + Math.sin(time * 9) * 0.004;
  // Equalizer
  eqBars.forEach((b, i) => { const h = 0.25 + (0.5 + 0.5 * Math.sin(time * 5 + i * 0.7)) * 0.5 + Math.min(1.2, combo * 0.1) * (0.5 + 0.5 * Math.sin(time * 9 + i)); b.scale.y = h; b.position.y = h / 2; });
  // Plunger
  plungerKick = Math.max(0, plungerKick - dt * 6);
  plunger.position.z = wz(985) + (charging ? power * 0.7 : 0) - 0.0;
  plunger.position.y = 0.15;
  $('meter').classList.toggle('on', charging); $('meterB').style.width = (power * 100) + '%';
  // Kamera-Wackeln
  shake = Math.max(0, shake - dt * 0.6);
  scene.position.set((Math.random() - 0.5) * shake, 0, (Math.random() - 0.5) * shake);
  updateParticles(dt);
  // HUD
  const sc = String(Math.floor(score)); if ($('score').textContent !== sc) $('score').textContent = sc;
  const bs = 'BEST ' + Math.max(best, Math.floor(score)); if ($('best').textContent !== bs) $('best').textContent = bs;
  const m = curMult(), ms = m > 1 ? `x${m}` : ''; if ($('mult').textContent !== ms) $('mult').textContent = ms;
  const camp = mode === 'campaign', tn = camp ? `Tisch ${tableIdx + 1}/${TABLE_COUNT} · ${T.layout.name}` : T.name;
  if ($('tname').textContent !== tn) $('tname').textContent = tn;
  $('goalWrap').classList.toggle('hidden', !camp);
  if (camp) { const gt = `ZIEL ${Math.min(tableScore, T.diff.goal)} / ${T.diff.goal}`; if ($('goalTxt').textContent !== gt) $('goalTxt').textContent = gt; $('goalFill').style.width = Math.min(100, tableScore / T.diff.goal * 100) + '%'; }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
  // Logos einlesen / Tische anlegen
  if (!ready) {
    const done = probesLeft === 0;
    if (done || performance.now() - t0 > 3000) {
      if (syncTables() || !tablesBuilt) { tablesBuilt = true; loadTable(tableIdx); drawPreview(); setBallsUI(); setMode(mode); }
      if (done) {
        ready = true; $('bPlay').disabled = false; $('bPlay').textContent = 'PLAY';
        const n = rawLogos.filter(Boolean).length;
        $('status').textContent = n ? `${n} Logo${n > 1 ? 's' : ''} geladen – ${tables.length} Tische` : 'Platzhalter-Tische – Logos in „logos/“ ablegen (01 … 13, png oder jpg).';
      }
    }
    if (!tablesBuilt) return;
  }
  if (state !== 'paused') simulate(dt);
  animate(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
