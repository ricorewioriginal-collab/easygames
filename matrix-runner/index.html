<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Matrix Runner – Radio Edition</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#010805;color:#00ff66;
    font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #hud{position:fixed;top:6px;left:0;right:0;padding:8px 16px;display:flex;justify-content:space-between;
    pointer-events:none;text-shadow:0 0 8px #00ff66;font-size:clamp(14px,3.6vw,22px)}
  #bar{position:fixed;top:0;left:0;height:4px;width:0;background:#00ff66;box-shadow:0 0 10px #00ff66;pointer-events:none}
  #banner{white-space:pre-line;position:fixed;top:26%;left:0;right:0;text-align:center;font-weight:bold;opacity:0;pointer-events:none;
    font-size:clamp(24px,7vw,54px);text-shadow:0 0 18px #00ff66;padding:0 12px}
  #toast{position:fixed;bottom:7%;left:50%;transform:translateX(-50%);width:max-content;max-width:min(90vw,560px);
    background:rgba(0,20,10,.85);border:1px solid #00ff66;box-shadow:0 0 14px rgba(0,255,102,.5);
    padding:10px 16px;opacity:0;pointer-events:none;text-align:center;font-size:clamp(13px,3.4vw,17px)}
  .show{animation:fade 4s ease forwards}
  .flash{animation:fade 2.2s ease forwards}
  @keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:20px;text-align:center;background:rgba(1,8,5,.8)}
  #overlay.hidden{display:none}
  h1{margin:0;font-size:clamp(30px,8vw,64px);letter-spacing:.08em;text-shadow:0 0 20px #00ff66}
  #ovText{margin:0;max-width:560px;line-height:1.5;font-size:clamp(14px,3.6vw,18px);color:#9dffc4}
  button{font:inherit;font-size:22px;font-weight:bold;color:#001a0a;background:#00ff66;border:0;padding:12px 38px;
    cursor:pointer;box-shadow:0 0 20px #00ff66}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="hud"><span id="hScore">SCORE 0</span><span id="hLevel">LEVEL 1/10</span><span id="hBest">BEST 0</span></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="overlay">
  <h1 id="ovTitle">MATRIX RUNNER</h1>
  <p id="ovText"></p>
  <button id="btn">START</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined') {
  $('ovText').textContent = 'three.js konnte nicht geladen werden. Bitte Internetverbindung prüfen (oder three.min.js lokal einbinden).';
  $('btn').style.display = 'none';
  throw new Error('THREE missing');
}

/* ================= Konfiguration ================= */
// Eigene Senderlogos hier eintragen (Hochformat-PNG, ca. 340x480), z. B. ['logos/sender1.png','logos/sender2.png']
// Hinweis: Dafür das Spiel über einen lokalen Server oder GitHub Pages starten (nicht per file://).
const SENDER_LOGOS = [];

const LEVELS = 10, LEVEL_LEN = 600;            // Weltmeter pro Level
const BASE_SPEED = 18, SPEED_STEP = 3.2;       // ab Level 4: +SPEED_STEP pro Level
const LANES = [-2.4, 0, 2.4];
const JUMP_V = 12, GRAVITY = 32, SLIDE_TIME = 0.7, SPAWN_Z = -105;
const LEVEL_NAMES = ['Boot','Handshake','Router','Backbone','Datenstrom','Firewall','Proxy','Darknet','Mainframe','Root'];

const TIPS = [
  '😂 Wie nennt man ein Radio, das nie ausgeht? Dauerwelle.',
  '😂 Eine Schallplatte hat immer einen guten Lauf – solange sie keinen Sprung hat.',
  '😂 Treffen sich zwei Radios. „Na, wie ist die Lage?“ – „Alles auf Empfang!“',
  '😂 Warum flirten Mikrofone so gern? Sie hören jedes Wort.',
  '😂 Moderator beim Kaffee-Aus: „Wir müssen kurz in die Werbung!“',
  '😂 Die CD zur Playlist: „Ich kenne meine Grenzen – ungefähr 80 Minuten.“',
  '🎵 Die erste reguläre Radiosendung in Deutschland lief am 29. Oktober 1923 aus dem Berliner Vox-Haus.',
  '🎵 Die Compact Disc kam 1982 auf den Markt – entwickelt von Philips und Sony.',
  '🎵 Eine LP dreht sich mit 33⅓ Umdrehungen pro Minute, eine Single mit 45.',
  '🎵 Heinrich Hertz wies 1886–1888 Funkwellen nach – nach ihm ist die Einheit Hertz benannt.',
  '🎵 UKW-Radio sendet etwa zwischen 87,5 und 108 MHz.',
  '🎵 Schellackplatten drehten sich meist mit 78 Umdrehungen pro Minute.',
  '🎵 Der Legende nach bestimmte Beethovens 9. Sinfonie die Spielzeit der CD.'
];

/* ================= Hilfsfunktionen ================= */
const rnd = Math.random, pick = a => a[rnd() * a.length | 0];
const cache = {};
const memo = (k, f) => cache[k] || (cache[k] = f());
const GREEN = 0x00ff66, LIME = 0xb6ff3c, CYAN = 0x19f0ff, PINK = 0xff2e88, AMBER = 0xffb020;

const lineMat = c => memo('l' + c, () => new THREE.LineBasicMaterial({ color: c }));
const solidMat = c => memo('s' + c, () => new THREE.MeshBasicMaterial({ color: c }));

function neon(geo, key, edge, fill, angle) {
  const m = new THREE.Mesh(geo, solidMat(fill));
  m.add(new THREE.LineSegments(memo('e' + key, () => new THREE.EdgesGeometry(geo, angle)), lineMat(edge)));
  return m;
}
const neonBox = (w, h, d, edge, fill) => {
  const k = `b${w},${h},${d}`;
  return neon(memo(k, () => new THREE.BoxGeometry(w, h, d)), k, edge, fill, 1);
};
const neonCyl = (rt, rb, h, seg, edge, fill) => {
  const k = `y${rt},${rb},${h},${seg}`;
  return neon(memo(k, () => new THREE.CylinderGeometry(rt, rb, h, seg)), k, edge, fill, 30);
};
const circle = (r, c, n = 40) => new THREE.LineLoop(memo(`c${r},${n}`, () => {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); }
  return new THREE.BufferGeometry().setFromPoints(p);
}), lineMat(c));

/* ================= Szene ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010805);
scene.fog = new THREE.Fog(0x010805, 35, 115);
const camera = new THREE.PerspectiveCamera(68, innerWidth / innerHeight, 0.1, 200);

// Boden + Spurlinien
const floor = new THREE.Mesh(new THREE.PlaneGeometry(8.6, 260).rotateX(-Math.PI / 2), solidMat(0x021a0d));
floor.position.z = -100;
scene.add(floor);
[-3.6, -1.2, 1.2, 3.6].forEach((x, i) => {
  const l = new THREE.Mesh(new THREE.BoxGeometry(i % 3 ? 0.05 : 0.12, 0.02, 260), solidMat(i % 3 ? 0x0fa84f : GREEN));
  l.position.set(x, 0.01, -100);
  scene.add(l);
});
const crossGeo = new THREE.BoxGeometry(8.4, 0.02, 0.05), crossMat = solidMat(0x0b6b35);
const cross = [];
for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(crossGeo, crossMat); m.position.y = 0.01; scene.add(m); cross.push(m); }

// Matrix-Wände
function matrixTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 256);
  g.font = '16px monospace';
  const chars = '01アイウエオカキクケコ日ラジオFMAM♪';
  for (let x = 0; x < 256; x += 16) {
    const len = 4 + rnd() * 10 | 0, y0 = rnd() * 16 | 0;
    for (let i = 0; i < len; i++) {
      g.fillStyle = `rgba(0,255,102,${0.15 + 0.85 * i / len})`;
      g.fillText(chars[rnd() * chars.length | 0], x, ((y0 + i) % 16) * 16 + 14);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(16, 1.5);
  return t;
}
const wallTexL = matrixTexture(), wallTexR = wallTexL.clone();
wallTexR.needsUpdate = true;
const wallGeo = new THREE.PlaneGeometry(260, 24);
[[-9, Math.PI / 2, wallTexL], [9, -Math.PI / 2, wallTexR]].forEach(([x, ry, map]) => {
  const w = new THREE.Mesh(wallGeo, new THREE.MeshBasicMaterial({ map, color: 0x66aa77 }));
  w.position.set(x, 11, -100); w.rotation.y = ry;
  scene.add(w);
});

// Datenströme: Partikel + leuchtende Streifen
const PN = 350, pPos = new Float32Array(PN * 3);
for (let i = 0; i < PN; i++) { pPos[i * 3] = (rnd() - 0.5) * 17; pPos[i * 3 + 1] = rnd() * 12; pPos[i * 3 + 2] = 10 - rnd() * 140; }
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x66ffaa, size: 0.18, transparent: true, opacity: 0.8, depthWrite: false })));

const streakGeo = new THREE.BoxGeometry(0.06, 0.06, 7), streaks = [];
for (let i = 0; i < 16; i++) {
  const s = new THREE.Mesh(streakGeo, solidMat(i % 3 ? GREEN : CYAN));
  s.position.set((i % 2 ? 1 : -1) * (4.6 + rnd() * 3.8), 0.4 + rnd() * 8, 10 - rnd() * 140);
  scene.add(s); streaks.push(s);
}

/* ================= Spieler ================= */
const player = new THREE.Group(), rig = new THREE.Group();
player.add(rig); scene.add(player);
const body = neonBox(0.6, 0.75, 0.35, GREEN, 0x042a14); body.position.y = 1.0;
const head = neonBox(0.38, 0.38, 0.38, 0xb6ffd0, 0x0a3d20); head.position.y = 1.6;
rig.add(body, head);
const limb = (w, h, x, y, edge) => {
  const p = new THREE.Group(), m = neonBox(w, h, w, edge, 0x042a14);
  m.position.y = -h / 2; p.add(m); p.position.set(x, y, 0); rig.add(p); return p;
};
const legL = limb(0.22, 0.65, -0.16, 0.65, GREEN), legR = limb(0.22, 0.65, 0.16, 0.65, GREEN);
const armL = limb(0.16, 0.55, -0.42, 1.3, LIME), armR = limb(0.16, 0.55, 0.42, 1.3, LIME);
const ring = circle(0.55, GREEN); ring.rotation.x = Math.PI / 2; ring.position.y = 0.03; scene.add(ring);

/* ================= Hindernisse ================= */
function logoCanvasTex(label) {
  const c = document.createElement('canvas'); c.width = 340; c.height = 460;
  const g = c.getContext('2d');
  g.fillStyle = '#021208'; g.fillRect(0, 0, 340, 460);
  g.strokeStyle = '#b6ff3c'; g.lineWidth = 8; g.strokeRect(12, 12, 316, 436);
  g.fillStyle = '#b6ff3c'; g.textAlign = 'center';
  g.font = 'bold 54px monospace'; g.fillText('SENDER', 170, 190);
  g.font = 'bold 54px monospace'; g.fillText('LOGO ' + label, 170, 260);
  g.font = '28px monospace'; g.fillText('Platzhalter', 170, 330);
  return new THREE.CanvasTexture(c);
}
const logoMats = (SENDER_LOGOS.length ? SENDER_LOGOS.map((_, i) => i + 1) : [1, 2, 3]).map((n, i) => {
  const mat = new THREE.MeshBasicMaterial({ map: logoCanvasTex(n) });
  if (SENDER_LOGOS[i]) new THREE.TextureLoader().load(SENDER_LOGOS[i], t => { mat.map = t; mat.needsUpdate = true; });
  return mat;
});

const BUILD = {
  radio() { // niedrig -> springen
    const g = new THREE.Group();
    const b = neonBox(1.5, 0.8, 0.7, AMBER, 0x2a1a02); b.position.y = 0.4; g.add(b);
    const sp = neonCyl(0.24, 0.24, 0.06, 20, AMBER, 0x120a01); sp.rotation.x = Math.PI / 2; sp.position.set(-0.4, 0.4, 0.37); g.add(sp);
    const dial = neonBox(0.5, 0.14, 0.06, CYAN, 0x022a2e); dial.position.set(0.35, 0.55, 0.37); g.add(dial);
    const knob = neonCyl(0.09, 0.09, 0.06, 10, AMBER, 0x120a01); knob.rotation.x = Math.PI / 2; knob.position.set(0.35, 0.25, 0.37); g.add(knob);
    const ant = neonBox(0.04, 0.7, 0.04, AMBER, AMBER); ant.position.set(0.55, 1.15, 0); ant.rotation.z = -0.35; g.add(ant);
    return { mesh: g, hw: 0.75, hd: 0.4, y0: 0, y1: 1.0 };
  },
  logo() { // hoch -> Spur wechseln
    const g = new THREE.Group();
    const f = neonBox(1.9, 2.5, 0.3, LIME, 0x041a0a); f.position.y = 1.25; g.add(f);
    const p = new THREE.Mesh(memo('logoPlane', () => new THREE.PlaneGeometry(1.7, 2.3)), pick(logoMats));
    p.position.set(0, 1.25, 0.16); g.add(p);
    return { mesh: g, hw: 0.95, hd: 0.2, y0: 0, y1: 2.5 };
  },
  wave() { // Störwelle in Kopfhöhe -> rutschen
    const g = new THREE.Group();
    [-1, 1].forEach(s => { const p = neonBox(0.12, 2.4, 0.12, PINK, 0x2a0414); p.position.set(s * 1.05, 1.2, 0); g.add(p); });
    const top = neonBox(2.2, 0.12, 0.12, PINK, 0x2a0414); top.position.y = 2.4; g.add(top);
    const zig = new THREE.Line(memo('zig', () => {
      const p = [];
      for (let i = 0; i <= 40; i++) p.push(new THREE.Vector3(-1 + i * 0.05, (i % 2 ? 1 : -1) * 0.5 * (0.4 + 0.6 * Math.abs(Math.sin(i * 0.7))), 0));
      return new THREE.BufferGeometry().setFromPoints(p);
    }), lineMat(PINK));
    zig.position.y = 1.65;
    const pane = new THREE.Mesh(memo('pane', () => new THREE.PlaneGeometry(2, 1.3)),
      memo('paneMat', () => new THREE.MeshBasicMaterial({ color: PINK, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })));
    pane.position.y = 1.65;
    g.add(zig, pane);
    return { mesh: g, hw: 1.05, hd: 0.25, y0: 1.1, y1: 2.5, update: t => { zig.scale.y = 0.55 + 0.45 * Math.sin(t * 14); } };
  },
  mic() { // hoch -> Spur wechseln
    const g = new THREE.Group();
    const base = neonCyl(0.5, 0.55, 0.12, 16, CYAN, 0x022a2e); base.position.y = 0.06;
    const pole = neonCyl(0.05, 0.05, 1.8, 8, CYAN, CYAN); pole.position.y = 1.0;
    const head = new THREE.Mesh(memo('micHead', () => new THREE.SphereGeometry(0.34, 12, 8)),
      memo('micMat', () => new THREE.MeshBasicMaterial({ color: CYAN, wireframe: true })));
    head.position.y = 2.1;
    g.add(base, pole, head);
    return { mesh: g, hw: 0.5, hd: 0.3, y0: 0, y1: 2.45 };
  },
  cd() { // stehende CD -> springen
    const R = 0.75, g = new THREE.Group(), spin = new THREE.Group();
    const disc = new THREE.Mesh(memo('cdRing', () => new THREE.RingGeometry(0.16, R, 32)),
      memo('cdMat', () => new THREE.MeshBasicMaterial({ color: 0x2affd5, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false })));
    const spoke = new THREE.Line(memo('spoke', () => new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0.16, 0, 0), new THREE.Vector3(R, 0, 0)])), lineMat(0xffffff));
    spin.add(disc, circle(R, CYAN), circle(0.16, CYAN), spoke);
    spin.position.y = R + 0.03; g.add(spin);
    return { mesh: g, hw: 0.75, hd: 0.2, y0: 0, y1: 1.5, update: t => { spin.rotation.z = -t * 6; } };
  },
  vinyl() { // flache Schallplatte -> springen
    const g = new THREE.Group(), spin = new THREE.Group();
    spin.position.y = 0.1;
    spin.add(neonCyl(1, 1, 0.12, 40, PINK, 0x0a0a0a));
    [0.75, 0.5].forEach(r => { const c = circle(r, 0x666666); c.rotation.x = Math.PI / 2; c.position.y = 0.07; spin.add(c); });
    spin.add(neonCyl(0.28, 0.28, 0.14, 16, AMBER, AMBER));
    const mark = neonBox(0.08, 0.02, 0.4, 0xffffff, 0xffffff); mark.position.set(0.65, 0.07, 0); spin.add(mark);
    g.add(spin);
    return { mesh: g, hw: 1.0, hd: 1.0, y0: 0, y1: 0.45, update: t => { spin.rotation.y = t * 3; } };
  }
};
const TYPES = ['radio', 'logo', 'wave', 'mic', 'cd', 'vinyl'];   // Reihenfolge = Freischaltung
const PASSABLE = ['radio', 'wave', 'cd', 'vinyl'];               // per Sprung/Rutschen überwindbar

/* ================= Spielzustand ================= */
let state = 'menu';            // menu | play | dead | over | win
let time = 0, scroll = 0, dist = 0, score = 0, speed = 12, level = 1;
let lane = 1, px = 0, py = 0, vy = 0, slideT = 0, wantSlide = false;
let spawnIn = 0, tipT = 0, deadT = 0, endAt = 0, tipQ = [];
let obstacles = [];
let best = 0;
try { best = +localStorage.getItem('matrixRunnerBest') || 0; } catch (e) {}

const hScore = $('hScore'), hLevel = $('hLevel'), hBest = $('hBest'), bar = $('bar');
const setText = (el, t) => { if (el.textContent !== t) el.textContent = t; };

function retrigger(el, cls, text) {
  el.textContent = text;
  el.classList.remove('show', 'flash'); void el.offsetWidth; el.classList.add(cls);
}
function showTip() {
  if (!tipQ.length) tipQ = TIPS.map((_, i) => i).sort(() => rnd() - 0.5);
  retrigger($('toast'), 'show', TIPS[tipQ.pop()]);
}
function showOverlay(title, html, btn) {
  $('ovTitle').textContent = title; $('ovText').innerHTML = html; $('btn').textContent = btn;
  $('overlay').classList.remove('hidden');
}

function clearObstacles() { obstacles.forEach(o => scene.remove(o.mesh)); obstacles = []; }

function startGame() {
  clearObstacles();
  state = 'play'; dist = 0; score = 0; level = 1; speed = BASE_SPEED;
  lane = 1; px = 0; py = 0; vy = 0; slideT = 0; wantSlide = false;
  spawnIn = 1.6; tipT = 6; deadT = 0;
  $('overlay').classList.add('hidden');
  $('toast').classList.remove('show');
  retrigger($('banner'), 'flash', `LEVEL 1 · ${LEVEL_NAMES[0]}`);
}

function endGame(won) {
  state = won ? 'win' : 'dead';
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem('matrixRunnerBest', best); } catch (e) {} }
  if (won) finishOverlay(true);
}
function finishOverlay(won) {
  state = won ? 'win' : 'over';
  endAt = performance.now();
  showOverlay(won ? 'SYSTEM GEHACKT!' : 'GAME OVER',
    `${won ? 'Alle 10 Level geschafft!<br>' : `Level ${level} · ${LEVEL_NAMES[level - 1]}<br>`}Score: <b>${Math.floor(score)}</b> &nbsp; Best: <b>${best}</b>`,
    won ? 'NOCHMAL' : 'NEUSTART');
}

/* ================= Spawning ================= */
function addObstacle(type, laneIdx) {
  const o = BUILD[type]();
  o.x = LANES[laneIdx]; o.z = SPAWN_Z;
  o.mesh.position.set(o.x, 0, o.z);
  scene.add(o.mesh); obstacles.push(o);
}
function spawnRow() {
  const d = Math.max(0, level - 3);                         // Schwierigkeit steigt erst nach Level 3
  const av = TYPES.slice(0, level === 1 ? 2 : level === 2 ? 4 : 6);
  const act = av.filter(t => PASSABLE.includes(t));
  const pAct = level < 2 ? 0 : level <= 3 ? 0.15 : Math.min(0.4, 0.15 + 0.03 * d);
  const free = rnd() * 3 | 0;
  if (rnd() < pAct) {                                       // Sprung-/Rutsch-Wand
    const t = pick(act), skip = d >= 3 && rnd() < 0.3 ? free : -1;
    for (let i = 0; i < 3; i++) if (i !== skip) addObstacle(t, i);
    return;
  }
  const p = Math.min(0.92, 0.6 + 0.05 * d);                 // Spur-Reihe: mindestens eine Spur bleibt frei
  for (let i = 0; i < 3; i++) if (i !== free && rnd() < p) addObstacle(pick(av), i);
  if (d >= 2 && rnd() < Math.min(0.5, 0.1 * (d - 1))) addObstacle(pick(act), free);
}
const gapTime = () => (level <= 3 ? 1.5 : Math.max(0.9, 1.5 - 0.085 * (level - 3))) + rnd() * 0.25;

/* ================= Steuerung ================= */
function moveLane(dir) { lane = Math.max(0, Math.min(2, lane + dir)); }
function jump() { if (py === 0 && vy === 0) { vy = JUMP_V; slideT = 0; } }
function slide() {
  if (py > 0) { vy = -24; wantSlide = true; }               // in der Luft: schnell fallen, dann rutschen
  else slideT = SLIDE_TIME;
}
const canRestart = () => state === 'menu' || ((state === 'over' || state === 'win') && performance.now() - endAt > 400);

addEventListener('keydown', e => {
  const k = e.code;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(k)) e.preventDefault();
  if (state !== 'play') { if ((k === 'Enter' || k === 'Space') && canRestart()) startGame(); return; }
  if (e.repeat) return;
  if (k === 'ArrowLeft' || k === 'KeyA') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'KeyD') moveLane(1);
  else if (k === 'ArrowUp' || k === 'KeyW' || k === 'Space') jump();
  else if (k === 'ArrowDown' || k === 'KeyS') slide();
});
$('btn').addEventListener('click', () => { if (canRestart()) startGame(); });

// Touch: wischen = Spur/Sprung/Rutschen, tippen = Sprung
let tx = 0, ty = 0, swiped = false;
const cv = renderer.domElement;
cv.addEventListener('touchstart', e => { e.preventDefault(); tx = e.touches[0].clientX; ty = e.touches[0].clientY; swiped = false; }, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if (swiped || state !== 'play') return;
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.hypot(dx, dy) < 28) return;
  swiped = true;
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) jump(); else slide();
}, { passive: false });
cv.addEventListener('touchend', e => { e.preventDefault(); if (!swiped && state === 'play') jump(); }, { passive: false });

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

/* ================= Update ================= */
function update(dt) {
  time += dt;
  const playing = state === 'play';
  if (state === 'menu') speed = 12;
  else if (state === 'dead' || state === 'over') speed *= Math.max(0, 1 - dt * 4);
  else if (playing) speed += (BASE_SPEED + SPEED_STEP * Math.max(0, level - 3) - speed) * Math.min(1, dt * 2);

  const move = speed * dt;
  scroll += move;

  // Welt scrollen
  cross.forEach((m, i) => { m.position.z = -190 + ((i * 5 + scroll) % 200); });
  wallTexL.offset.set(scroll / 16.25, time * 0.25);
  wallTexR.offset.set(-scroll / 16.25, time * 0.25);
  const pp = pGeo.attributes.position.array;
  for (let i = 0; i < PN; i++) { if ((pp[i * 3 + 2] += move * 1.3) > 10) pp[i * 3 + 2] -= 140; }
  pGeo.attributes.position.needsUpdate = true;
  streaks.forEach(s => { if ((s.position.z += move * 1.8) > 14) s.position.z -= 150; });

  // Spiel
  if (playing) {
    dist += move;
    score += move * 0.5 * (1 + 0.1 * (level - 1));
    const lv = Math.min(LEVELS, Math.floor(dist / LEVEL_LEN) + 1);
    if (lv > level) {
      level = lv;
      retrigger($('banner'), 'flash', `LEVEL ${level} · ${LEVEL_NAMES[level - 1]}${level > 3 ? '\n⚡ Tempo steigt' : ''}`);
    }
    if (dist >= LEVELS * LEVEL_LEN) endGame(true);

    if ((spawnIn -= dt) <= 0) { spawnRow(); spawnIn = gapTime(); }
    if ((tipT += dt) >= 12) { tipT = 0; showTip(); }

    if (slideT > 0) slideT -= dt;
    if (py > 0 || vy > 0) {
      vy -= GRAVITY * dt; py += vy * dt;
      if (py <= 0) { py = 0; vy = 0; if (wantSlide) { slideT = SLIDE_TIME; wantSlide = false; } }
    }
    px += (LANES[lane] - px) * Math.min(1, dt * 14);
  }

  // Hindernisse bewegen + Kollision
  const h = slideT > 0 ? 0.8 : 1.8;
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i], prev = o.z;
    o.z += move; o.mesh.position.z = o.z;
    if (o.update) o.update(time);
    if (o.z > 12) { scene.remove(o.mesh); obstacles.splice(i, 1); continue; }
    if (playing && o.z + o.hd >= -0.3 && prev - o.hd <= 0.3 &&   // z (inkl. Weg im Frame)
        Math.abs(px - o.x) < o.hw + 0.2 &&                         // x
        py < o.y1 - 0.05 && py + h > o.y0 + 0.05) {                // y
      endGame(false); deadT = 0;
    }
  }

  if (state === 'dead') { deadT += dt; if (deadT > 0.8) finishOverlay(false); }

  // Spieler-Animation
  const onGround = py === 0, ph = scroll * 0.35, sw = Math.sin(ph) * 0.9;
  if (onGround) { legL.rotation.x = sw; legR.rotation.x = -sw; armL.rotation.x = -sw; armR.rotation.x = sw; }
  else { legL.rotation.x = -0.8; legR.rotation.x = 0.4; armL.rotation.x = -2.2; armR.rotation.x = -2.2; }
  const sliding = slideT > 0, dead = state === 'dead' || state === 'over';
  const tRot = dead ? -1.3 : sliding ? 1.0 : -0.1, tScale = sliding ? 0.7 : 1, k = Math.min(1, dt * 15);
  rig.rotation.x += (tRot - rig.rotation.x) * k;
  rig.scale.y += (tScale - rig.scale.y) * k;
  rig.position.y = onGround && !sliding ? Math.abs(Math.sin(ph)) * 0.06 : 0;
  player.position.set(px, py, 0);
  player.rotation.z = (px - LANES[lane]) * 0.25;
  ring.position.x = px;

  // Kamera
  const aspect = innerWidth / innerHeight;
  const fov = (aspect < 1.2 ? 90 : 68) + (speed - BASE_SPEED) * 0.3;
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov = fov; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  const shake = state === 'dead' ? (1 - Math.min(1, deadT / 0.8)) * 0.4 : 0;
  camera.position.set(px * 0.55 + (rnd() - 0.5) * shake, 4.4 + py * 0.25 + (rnd() - 0.5) * shake, 7.6);
  camera.lookAt(px * 0.3, 1.4 + py * 0.2, -9);

  // HUD
  setText(hScore, 'SCORE ' + Math.floor(score));
  setText(hLevel, `LEVEL ${level}/${LEVELS}`);
  setText(hBest, 'BEST ' + best);
  bar.style.width = (state === 'play' ? (dist % LEVEL_LEN) / LEVEL_LEN * 100 : 0) + '%';
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
}

showOverlay('MATRIX RUNNER',
  'Du rennst durch die Matrix im Inneren des Internets. 10 Level – ab Level 4 wird es schneller und härter.<br><br>' +
  '<b>← → / A D</b> Spur wechseln<br><b>↑ / W / Leertaste</b> Springen<br><b>↓ / S</b> Rutschen<br>' +
  '<b>Touch:</b> wischen, Tippen = Sprung<br><br>' +
  '<span style="color:#ffb020">Radios, CDs &amp; Platten: springen</span> · <span style="color:#ff2e88">Störwellen: rutschen</span> · <span style="color:#b6ff3c">Logos &amp; Mikros: ausweichen</span>',
  'START');
requestAnimationFrame(frame);
</script>
</body>
</html>
