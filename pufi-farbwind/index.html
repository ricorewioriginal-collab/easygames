<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b2f5c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pufi & der Farbwind 3D – Insel-Abenteuer in echtem 3D: 24 Level auf sechs Inseln, frei laufen, flattern, Zunge, Farbeier werfen, viele Gegner und Hilfen, Retro-Zonen und zwei Bosse. Controller, Touch und Tastatur.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./card.svg" type="image/svg+xml">
<title>Pufi & der Farbwind 3D</title>
<link rel="stylesheet" href="./3d/stil.css">
</head><body>
<canvas id="gl" aria-label="Pufi & der Farbwind 3D – Spielwelt"></canvas>
<div id="vignette" aria-hidden="true"></div><div id="scan" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div>
<header id="hud" hidden>
  <div class="hl">
    <div id="hStar" class="starRing" title="Sterne – fallen auf 0, holen die Nebelgreifer Tamo"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="bg"/><circle cx="22" cy="22" r="19" class="fg" id="hStarArc"/></svg><b id="hStarN">10</b><i>★</i></div>
    <div class="chips"><span id="hLives">♥ 5</span><span id="hEggs" aria-label="Eier"></span></div>
  </div>
  <div class="hc" id="hLevel">1-1</div>
  <div class="hr">
    <span id="hCoins">● 0</span><span id="hRed">◎ 0/8</span><span id="hFlowers">✿ 0/5</span>
    <button id="bFull" type="button" aria-label="Vollbild">⛶</button><button id="bSound" type="button" aria-label="Ton an/aus">♪</button><button id="bPause" type="button" aria-label="Pause">Ⅱ</button>
  </div>
</header>
<div id="banner" aria-live="polite"></div><div id="toast" aria-live="polite"></div><div id="count" aria-hidden="true"></div>
<div id="touch" hidden>
  <div id="stickZone" aria-label="Bewegen: Daumen auflegen und ziehen"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div id="face" aria-label="Aktionstasten">
    <button class="x" data-act="tongue" aria-label="X – Zunge">X<small>ZUNGE</small></button>
    <button class="y" data-act="pound" aria-label="Y – Stampfen oder Ei legen">Y<small>STAMPF</small></button>
    <button class="a" data-act="jump" aria-label="A – Springen, halten zum Flattern">A<small>SPRUNG</small></button>
    <button class="b" data-act="throw" aria-label="B – Ei zielen und werfen">B<small>EI</small></button>
  </div>
  <button id="camBtn" data-act="cam" aria-label="Kamera hinter Pufi">🎥</button>
</div>
<div id="boot" role="dialog" aria-label="Startbildschirm">
  <div class="logo"><small>DIE FARBWIND-INSELN</small><b data-t="PUFI">PUFI</b><span>&amp; der Farbwind</span><em>3D</em></div>
  <div class="bootFoot"><div class="bar"><i></i></div><p id="bootPrompt">LÄDT …</p><p class="copy">EasyGames · eigenes Insel-Abenteuer · Neuauflage</p></div>
</div>
<div id="screen" class="screen" hidden></div>
<div id="cloudBox" hidden><div id="cloudMount"></div></div>
<script src="../bunte-insel/vendor/three.min.js"></script>
<script src="./3d/welten.js"></script>
<script src="./3d/klang.js"></script>
<script src="./3d/grafik.js"></script>
<script src="./3d/spiel.js"></script>
<script src="../cloud/anmacha-cloud.js" data-game="pufi-farbwind" data-prefix="easygames.pufi-farbwind" data-mount="#cloudMount" data-hint="Mit Google anmelden: Inseln, Bestwerte und Einstellungen geräteübergreifend speichern." defer></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
<script src="../gamepad.js" data-pad="info menu=.screen" data-pad-labels="ls=Laufen · in Menüs wählen; rs=Kamera drehen; dpad=in Menüs wählen; a=Springen (halten = flattern) · Bestätigen; b=Ei zielen (halten) und werfen · Zurück; x=Zunge · Gefangenes ausspucken; y=Stampfen (in der Luft) · Ei legen; lb=Stampfen · Ei legen; rb=Ei zielen und werfen; lt=Kamera hinter Pufi; rt=Ei zielen und werfen; l3=Kamera hinter Pufi; select=Musik an/aus; start=Pausemenü" defer></script>
<script src="../egstat.js" defer></script>
</body></html>
