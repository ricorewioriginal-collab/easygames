<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Erfolge – easygames</title>
<style>
:root{--bg:#0b1020;--card:#151b33;--line:#ffffff24;--text:#f3f5ff;--mut:#a9b0cf;--acc:#d4fd78;--gold:#ffc53d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin:0 0 14px}
header h1{font-size:22px;margin:0;flex:1}
.back{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
body.embed .back{display:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hero{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(135deg,#1c2550,#151b33 60%)}
.rk{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:radial-gradient(circle at 30% 25%,#ffe58a,var(--gold));color:#3a2a00;box-shadow:0 0 0 4px #ffc53d33}
.hero .tx{flex:1;min-width:0}
.hero b{display:block;font-size:20px}
.hero small{color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#ffffff1f;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7be6a0);border-radius:99px;width:0;transition:width .6s}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:99px;padding:8px 14px;font:600 13px system-ui;cursor:pointer;min-height:38px}
.tab[aria-pressed=true]{background:var(--acc);color:#10140a;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px;margin:12px 0 0;padding:0;list-style:none}
.ach{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;display:flex;flex-direction:column;gap:6px}
.ach .ic{font-size:30px;line-height:1}
.ach.lock .ic,.ach.lock h3{filter:grayscale(1);opacity:.55}
.ach h3{margin:0;font-size:15px}
.ach p{margin:0;color:var(--mut);font-size:13px}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;background:#ffffff26}
.pips i.on{background:var(--gold)}
.ach .meta{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.ach.done{border-color:#ffc53d88}
.card{margin:20px 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px}
.card h2{font-size:16px;margin:0 0 6px}
.card p{margin:6px 0;color:var(--mut);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.btn{flex:1 1 180px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#222a4d;color:var(--text);font:600 14px system-ui;cursor:pointer;padding:0 14px}
.btn.pri{background:var(--acc);color:#10140a;border-color:var(--acc)}
.ok{color:#81c995;font-weight:600}
.err{color:#f28b82}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-140%);transition:transform .4s;background:#222a4d;border:1px solid var(--gold);border-radius:14px;padding:10px 16px;font-weight:700;z-index:9;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
h2.sec{font-size:17px;margin:26px 2px 4px}
.sub{color:var(--mut);font-size:13px;margin:0 2px 10px}
.og{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 8px;overflow:hidden}
.og[open]{border-color:#ffffff40}
.og summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;min-height:48px}
.og summary::-webkit-details-marker{display:none}
.og summary b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.og .ogi{font-size:22px;line-height:1}
.og .ogc{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px;flex:none}
.og .ogb{display:block;width:56px;height:6px;border-radius:99px;background:#ffffff1f;overflow:hidden;flex:none}
.og .ogb u{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#7be6a0);text-decoration:none}
.og.full .ogc{color:var(--gold)}
.og ul{list-style:none;margin:0;padding:4px 10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.og li{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.3}
.og li.done{border-color:#ffc53d88;background:#ffc53d12}
.og li:not(.done){opacity:.6}.og li:not(.done) .ci{filter:grayscale(1)}
.og li .ci{font-size:20px;line-height:1.1;flex:none}
.og li small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
@media (prefers-reduced-motion:reduce){.bar>i,#toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>🏅 Erfolge</h1>
    <a class="back" id="back" href="index.html">← Spiele</a>
  </header>

  <section class="hero" aria-live="polite">
    <div class="rk" id="rkIc">🎮</div>
    <div class="tx"><b id="rkName">Lade …</b><div class="bar"><i id="rkBar"></i></div><small id="rkSub"></small></div>
  </section>

  <div class="tabs" id="tabs" role="group" aria-label="Filter">
    <button type="button" class="tab" data-f="all" aria-pressed="true">Alle</button>
    <button type="button" class="tab" data-f="done" aria-pressed="false">Freigeschaltet</button>
    <button type="button" class="tab" data-f="open" aria-pressed="false">Offen</button>
  </div>
  <ul class="grid" id="grid"></ul>

  <h2 class="sec" id="ogTitle" hidden>🎯 Erfolge und Medaillen je Spiel</h2>
  <p class="sub" id="ogSub" hidden></p>
  <div id="og"></div>

  <section class="card" id="me" aria-labelledby="meTitle"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Nur Anmeldung (kein Spielstand-Abgleich, kein Knopf, keine Ranglisten-Laufzeit): data-ui/data-sync/data-board = off -->
<script src="cloud/anmacha-cloud.js" data-game="erfolge" data-prefix="anmacha-erfolge-ohne-spielstand" data-ui="off" data-sync="off" data-board="off" defer></script>
<script src="cloud/anmacha-board.js" defer></script>
<script src="cloud/anmacha-ach.js" defer></script>
<script src="cloud/anmacha-gameach.js" defer></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var B = window.AnMaChaBoard, A = window.AnMaChaAch, GA = window.AnMaChaGameAch, Cloud = window.AnMaChaCloud, ownData = {};
  var qs = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  if (qs.get('embed') === '1') document.body.classList.add('embed');
  var APP = location.hostname === 'appassets.local' || location.hostname === 'appassets.androidplatform.net' || !!window.EasyGamesApp || /(RicoReWi|EasyGames)App\//.test(navigator.userAgent);
  var games = [], res = null, filter = 'all', status = '', busy = false, toastT = 0;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function user() { return Cloud && Cloud.user ? Cloud.user() : null; }
  function fmtDate(t) { try { return new Date(t).toLocaleDateString('de-DE'); } catch (e) { return ''; } }
  function fmtNum(n) { try { return Number(n).toLocaleString('de-DE'); } catch (e) { return String(n); } }
  var RANK_ICONS = ['🎮', '🕹️', '🎯', '🚀', '👑', '🏆', '🌟'];

  function toast(list) {
    if (!list.length) return;
    var el = $('toast');
    el.textContent = '🎉 ' + (list.length === 1 ? 'Neu: ' + list[0].icon + ' ' + list[0].name : list.length + ' neue Erfolge: ' + list.slice(0, 6).map(function (x) { return x.icon; }).join(' ') + (list.length > 6 ? ' …' : ''));
    el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 4500);
  }
  function draw() {
    if (!res) return;
    var r = res.rank;
    $('rkIc').textContent = RANK_ICONS[r.index] || '🎮';
    $('rkName').textContent = r.name + ' · ' + r.pts + ' Punkte';
    $('rkBar').style.width = (r.to == null ? 100 : Math.round(100 * (r.pts - r.from) / (r.to - r.from))) + '%';
    $('rkSub').textContent = res.done + ' von ' + res.total + ' Stufen freigeschaltet' + (r.to != null ? ' · noch ' + (r.to - r.pts) + ' Punkte bis „' + r.nextName + '“' : ' · höchster Rang!');
    var list = res.items.filter(function (i) { return filter === 'all' || (filter === 'done' ? i.level > 0 : i.level < i.levels); });
    $('grid').innerHTML = list.length ? list.map(function (i) {
      var pips = ''; for (var k = 1; k <= i.levels; k++) pips += '<i' + (k <= i.level ? ' class="on"' : '') + '></i>';
      var full = i.level >= i.levels;
      var meta = full ? '✓ Alles geschafft' + (i.at ? ' · ' + fmtDate(i.at) : '') : fmtNum(i.value) + ' / ' + fmtNum(i.next) + (i.unit ? ' ' + i.unit : '') + (i.at ? ' · Stufe ' + i.level + ' seit ' + fmtDate(i.at) : '');
      return '<li class="ach ' + (i.level > 0 ? 'done' : 'lock') + '"><div class="ic" aria-hidden="true">' + esc(i.icon) + '</div><h3>' + esc(i.name) + '</h3>' +
        '<p>' + esc(full ? '' : i.desc) + '</p>' + (i.levels > 1 ? '<div class="pips" aria-label="Stufe ' + i.level + ' von ' + i.levels + '">' + pips + '</div>' : '') +
        (full ? '' : '<div class="bar"><i style="width:' + i.pct + '%"></i></div>') + '<div class="meta"><span>' + esc(meta) + '</span></div></li>';
    }).join('') : '<li class="ach lock"><p>Hier ist noch nichts – spiel einfach los! 🎮</p></li>';
  }
  // Eigene Erfolge der Spiele: lokal gelesene (GA.collect) plus die im Profil gemerkten (state.gu, z. B. aus Apps oder von anderen Geräten)
  function ownInput() {
    var out = {}, loc = GA ? GA.collect() : {}, def = GA ? GA.definitions() : {};
    ownData = {};
    Object.keys(def).forEach(function (g) { var l = loc[g]; out[g] = { total: def[g].defs.length, done: l ? l.done : 0, unlocked: l ? l.unlocked : {} }; ownData[g] = { title: def[g].title, defs: def[g].defs, unlocked: l ? l.unlocked : {} }; });
    Object.keys(loc).forEach(function (g) { if (!out[g]) { out[g] = { total: loc[g].total, done: loc[g].done, unlocked: loc[g].unlocked }; ownData[g] = { title: loc[g].title, defs: loc[g].defs, unlocked: loc[g].unlocked }; } });
    return out;
  }
  function drawOwn() {
    var gu = (res && res.state && res.state.gu) || {}, pg = (res && res.stats && res.stats.perGame) || {}, medals = A.MEDALS || [], total = 0, done = 0, icon = {}, title = {}, ids = {};
    games.forEach(function (g) { if (g.cloud && g.cloud.game) { icon[g.cloud.game] = g.icon; title[g.cloud.game] = String(g.title || g.cloud.game).split(' – ')[0]; ids[g.cloud.game] = 1; } });
    Object.keys(ownData).forEach(function (g) { ids[g] = 1; });
    var rows = Object.keys(ids).map(function (g) {
      var o = ownData[g] || { title: title[g] || g, defs: [], unlocked: {} }, got = {}, n = 0, m = pg[g] || { days: 0, got: [] }, mg = medals.map(function (d, i) { return !!m.got[i]; });
      o.defs.forEach(function (d) { if (o.unlocked[d.id] || gu[g + ':' + d.id]) { got[d.id] = o.unlocked[d.id] > 1 ? o.unlocked[d.id] : gu[g + ':' + d.id] || 1; n++; } });
      total += o.defs.length; done += n;
      var cnt = n + mg.filter(Boolean).length, all = o.defs.length + medals.length;
      return { g: g, o: o, got: got, n: cnt, all: all, mg: mg, days: m.days };
    }).sort(function (a, b) { return (b.n / b.all) - (a.n / a.all) || a.o.title.localeCompare(b.o.title, 'de'); });
    $('ogTitle').hidden = $('ogSub').hidden = !rows.length;
    $('ogSub').textContent = 'Jedes Spiel hat Medaillen für treues Spielen (zählt für „Medaillen“ oben). Manche Spiele haben zusätzlich eigene Erfolge: ' + done + ' von ' + total + ' freigeschaltet (zählt für „Spiel-Erfolge“).';
    $('og').innerHTML = rows.map(function (r) {
      var pct = Math.round(100 * r.n / Math.max(1, r.all));
      function li(on, ic, t, d, since, md) { return '<li class="' + (on ? 'done' : '') + (md ? ' md' : '') + '"><span class="ci" aria-hidden="true">' + esc(on ? ic : '🔒') + '</span><span><b>' + esc(t) + '</b>' + (d ? '<small>' + esc(d) + '</small>' : '') + (on && since > 1 ? '<small>seit ' + fmtDate(since) + '</small>' : '') + '</span></li>'; }
      return '<details class="og' + ((r.o.defs.length ? r.o.defs.length === r.n - r.mg.filter(Boolean).length : r.n === r.all) ? ' full' : '') + '"><summary><span class="ogi" aria-hidden="true">' + esc(icon[r.g] || '🎮') + '</span><b>' + esc(r.o.title) + '</b><i class="ogb" aria-hidden="true"><u style="width:' + pct + '%"></u></i><span class="ogc">' + r.n + ' / ' + r.all + '</span></summary><ul>' +
        medals.map(function (d, i) { return li(r.mg[i], d.icon, d.title, d.desc + (!r.mg[i] && r.days ? ' (bisher ' + r.days + ')' : ''), 0, 1); }).join('') +
        r.o.defs.map(function (d) { return li(!!r.got[d.id], d.icon, d.title, d.desc, r.got[d.id]); }).join('') + '</ul></details>';
    }).join('');
  }
  function drawMe() {
    var u = user(), h = '<h2 id="meTitle">Geräteübergreifend sichern</h2>';
    if (!u) {
      h += '<p>Deine Erfolge zählen über alle Spiele hinweg und bleiben auf diesem Gerät gespeichert. Mit Google anmelden sichert sie zusätzlich – dann hast du sie auch auf dem Handy, im Browser und in der App. Niemand sonst sieht sie.</p>';
      h += APP ? '<p>In der App: Öffne ein Spiel, tippe auf ☁ und verbinde dein Google-Konto – danach erscheinen deine Erfolge hier.</p>' : '<div class="row"><button class="btn pri" id="bIn" type="button">Mit Google anmelden</button></div>';
    } else {
      h += '<p class="ok">● Mit Google verbunden – deine Erfolge werden gesichert.</p><div class="row"><button class="btn" id="bSync" type="button"' + (busy ? ' disabled' : '') + '>Jetzt abgleichen</button><button class="btn" id="bOut" type="button">Abmelden</button></div>';
    }
    if (status) h += '<p class="' + (/^⚠/.test(status) ? 'err' : 'ok') + '">' + esc(status) + '</p>';
    $('me').innerHTML = h;
  }
  function evaluate(syncFirst) {
    var u = user(), p = syncFirst && u && B.getUserDoc ? A.sync(B) : Promise.resolve();
    return p.catch(function () {}).then(function () {
      res = A.run(games, B, { cloud: !!u, board: B.shared(), own: ownInput() });
      toast(res.fresh); draw(); drawOwn();
      // Neue Freischaltungen (z. B. Wolkenspieler) auch in die Cloud
      if (u && res.fresh.length && B.putUserDoc) return A.sync(B).catch(function () {});
    });
  }
  function afterAuth() {
    var u = user(); if (!u) { drawMe(); return evaluate(false); }
    return u.getIdToken().then(function () { return B.loadProfile(true); }).then(function () { drawMe(); return evaluate(true); });
  }
  $('me').addEventListener('click', function (e) {
    var id = e.target && e.target.id;
    if (id === 'bIn') { Cloud.signIn().then(afterAuth); }
    else if (id === 'bOut') { Cloud.signOut().then(function () { status = ''; drawMe(); return evaluate(false); }); }
    else if (id === 'bSync') { busy = true; status = ''; drawMe(); evaluate(true).then(function () { status = '✓ Abgeglichen.'; }, function () { status = '⚠ Abgleich gerade nicht möglich.'; }).then(function () { busy = false; drawMe(); }); }
  });
  $('tabs').addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.tab'); if (!t) return;
    filter = t.dataset.f; Array.prototype.forEach.call($('tabs').children, function (b) { b.setAttribute('aria-pressed', String(b === t)); }); draw();
  });

  if (!B || !A || !GA || !Cloud) { $('rkName').textContent = 'Erfolge sind gerade nicht verfügbar.'; return; }
  drawMe();
  fetch('sync/catalog.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (c) {
    games = c.games || [];
    return evaluate(false).then(function () { return Cloud.account ? Cloud.account() : null; }).then(afterAuth);   // erst lokal zeigen, dann (angemeldet) mit dem Profil abgleichen
  }).catch(function () { if (!res) $('rkName').textContent = 'Spieleliste gerade nicht erreichbar.'; });
});
</script>
</body>
</html>
